<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RECRON • Team Directory</title><style>
:root{--bg:#080b12;--panel:#111722;--gold:#f6c744;--gold2:#ffdf72;--text:#f5f7fb;--muted:#9aa5b5;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 50% -10%,rgba(246,199,68,.13),transparent 34%),linear-gradient(180deg,#0b0f17,#070a10);color:var(--text)}
body{padding:10px 8px 28px}.wrap{width:min(1040px,100%);margin:auto}.panel{position:relative;overflow:hidden;border:1px solid rgba(246,199,68,.42);border-radius:24px;background:linear-gradient(135deg,rgba(255,255,255,.035),transparent 45%),linear-gradient(180deg,#131a26,#0d131d);box-shadow:0 24px 70px rgba(0,0,0,.45)}
.home{position:absolute;right:18px;top:16px;z-index:3;padding:9px 14px;border:1px solid rgba(246,199,68,.45);border-radius:999px;background:rgba(246,199,68,.07);color:var(--gold2);text-decoration:none;font-size:11px;font-weight:900;letter-spacing:1px}.header{padding:34px 24px 22px;border-bottom:1px solid var(--line)}.eyebrow{color:var(--gold);font-size:11px;font-weight:900;letter-spacing:2.5px;text-transform:uppercase}h1{margin:8px 0 0;font-size:clamp(32px,6vw,56px);line-height:1}.sub{margin:11px 0 0;color:#c0c8d4;font-size:13px;letter-spacing:.6px}.status{margin-top:10px;color:var(--muted);font-size:10px}.card{border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.015))}footer{padding:18px 24px;border-top:1px solid var(--line);color:#758093;font-size:9px;letter-spacing:1.2px;text-transform:uppercase}
@media(max-width:680px){.header{padding:30px 18px 20px}.home{right:13px;top:13px}.sub{font-size:11px}}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:20px}.stat{padding:18px;text-align:center}.stat b{display:block;color:var(--gold);font-size:30px}.stat span{color:var(--muted);font-size:10px;letter-spacing:1.5px;text-transform:uppercase}.teamgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:0 20px 20px}.team{padding:15px;display:grid;grid-template-columns:74px 1fr;gap:14px;align-items:center}.logo{width:74px;height:74px;object-fit:contain;border-radius:14px;background:rgba(255,255,255,.03)}.name{font-size:18px;font-weight:900}.meta{margin-top:5px;color:var(--muted);font-size:10px}.members{grid-column:1/-1;padding-top:10px;border-top:1px solid var(--line);color:#c7ced9;font-size:11px;line-height:1.65}@media(max-width:680px){.teamgrid{grid-template-columns:1fr;padding:0 12px 12px}.stats{padding:12px}.name{font-size:16px}}
</style></head><body><main class="wrap"><section class="panel"><a class="home" href="./">⌂ HOME</a><header class="header"><div class="eyebrow">RECRON</div><h1>TEAM DIRECTORY</h1><div class="sub">Participating Teams & Players</div><div id="status" class="status">Loading teams...</div></header><section class="stats"><div class="card stat"><b id="teamCount">—</b><span>Active Teams</span></div><div class="card stat"><b id="playerCount">—</b><span>Total Players</span></div></section><section id="teams" class="teamgrid"></section><footer>RECRON BOWLING TOURNAMENT 2026</footer></section></main><script>
const API="https://script.google.com/macros/s/AKfycbwW8_FQ12mi6iQqfZaXbZ7C0qDm5_hR--lSDwYzWGixBu-APdxAxgImby7ZeVkwbRVO/exec?page=api_teamdirectory&callback=teamDirectoryCallback";
function esc(v){const d=document.createElement("div");d.textContent=v==null?"":String(v);return d.innerHTML}
function logoUrl(v){v=String(v||"");let m=v.match(/\/d\/([A-Za-z0-9_-]+)/);if(m)return "https://drive.google.com/thumbnail?id="+m[1]+"&sz=w600";m=v.match(/[?&]id=([A-Za-z0-9_-]+)/);if(m)return "https://drive.google.com/thumbnail?id="+m[1]+"&sz=w600";return v}
function teamDirectoryCallback(data){const rows=(data||[]).filter(Boolean);document.getElementById("teamCount").textContent=rows.length;document.getElementById("playerCount").textContent=rows.reduce((n,t)=>n+(Number(t.count)||0),0);document.getElementById("status").textContent="Live directory";document.getElementById("teams").innerHTML=rows.map(t=>{const members=(t.members||[]).map(m=>esc(m.nama)).join(" • ")||"No players";return `<article class="card team"><img class="logo" src="${logoUrl(t.logo)}" onerror="this.style.visibility='hidden'"><div><div class="name">${esc(t.team)}</div><div class="meta">${t.count||0} PLAYERS • TOTAL ${Number(t.teamTotal)||0}</div></div><div class="members">${members}</div></article>`}).join("")}
function load(){const s=document.createElement("script");s.src=API;s.onerror=()=>document.getElementById("status").textContent="Unable to load team data";document.body.appendChild(s)}load();setInterval(load,10000);
</script></body></html>
