<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Score Entry Ketua Kumpulan</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top left,#182430 0%,#0b1118 45%,#05080c 100%);
  color:#fff;
}

body{
  min-height:100vh;
}

/* =====================================
   HEADER
===================================== */

.header{
  text-align:center;
  padding:30px 18px 20px;
}

.logo{
  width:78px;
  height:78px;
  object-fit:contain;
  margin-bottom:10px;
}

.title{
  margin:0;
  font-size:27px;
  font-weight:900;
}

.subtitle{
  margin-top:7px;
  color:#9da8b4;
  font-size:13px;
}

/* =====================================
   CONTAINER
===================================== */

.container{
  width:min(850px,94%);
  margin:0 auto;
  padding-bottom:45px;
}

/* =====================================
   CARD
===================================== */

.card{
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.075),
      rgba(255,255,255,.025)
    );

  border:1px solid rgba(255,255,255,.10);

  border-radius:20px;

  padding:22px;

  margin-bottom:16px;

  box-shadow:
    0 14px 35px rgba(0,0,0,.25);
}

/* =====================================
   LOGIN
===================================== */

.login-card{
  max-width:470px;
  margin:0 auto;
}

.label{
  display:block;
  font-size:13px;
  color:#aab4bf;
  margin-bottom:7px;
}

.input{
  width:100%;
  padding:14px 15px;

  border-radius:12px;

  border:1px solid rgba(255,255,255,.12);

  background:#0b1219;

  color:#fff;

  outline:none;

  font-size:15px;

  margin-bottom:14px;
}

.input:focus{
  border-color:rgba(255,255,255,.35);
}

.button{
  width:100%;

  border:0;

  border-radius:13px;

  padding:14px;

  font-size:15px;

  font-weight:800;

  cursor:pointer;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      #1769aa,
      #0d4c7c
    );

  transition:.18s;
}

.button:hover{
  transform:translateY(-1px);
}

.button:disabled{
  opacity:.5;
  cursor:not-allowed;
  transform:none;
}

/* =====================================
   TEAM HEADER
===================================== */

.team-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
}

.team-label{
  font-size:12px;
  color:#8995a1;
  margin-bottom:5px;
}

.team-name{
  font-size:25px;
  font-weight:900;
}

.leader-name{
  color:#9da8b4;
  font-size:13px;
  margin-top:4px;
}

.lock-team{
  font-size:13px;
  color:#9da8b4;
  padding:9px 12px;
  border-radius:10px;
  background:rgba(255,255,255,.06);
}

/* =====================================
   PLAYER
===================================== */

.player-title{
  font-size:14px;
  font-weight:800;
  margin-bottom:8px;
}

.player-select{
  width:100%;

  padding:15px;

  border-radius:13px;

  border:1px solid rgba(255,255,255,.13);

  background:#0b1219;

  color:#fff;

  font-size:15px;

  outline:none;
}

.player-select:focus{
  border-color:rgba(255,255,255,.35);
}

/* =====================================
   GAMES
===================================== */

.games{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:18px;
}

.game-box{
  border-radius:15px;
  padding:15px;

  background:rgba(255,255,255,.045);

  border:1px solid rgba(255,255,255,.08);
}

.game-box.active{
  border-color:rgba(50,170,255,.55);

  background:
    linear-gradient(
      145deg,
      rgba(25,110,175,.20),
      rgba(255,255,255,.035)
    );
}

.game-box.locked{
  opacity:.65;
}

.game-label{
  font-size:12px;
  color:#9ca8b4;
  font-weight:800;
  margin-bottom:8px;
}

.game-status{
  font-size:11px;
  margin-bottom:10px;
  color:#778491;
}

.game-status.active{
  color:#5eb9ff;
}

.game-status.saved{
  color:#72d28a;
}

.game-status.locked{
  color:#778491;
}

.score-input{
  width:100%;

  padding:13px 10px;

  text-align:center;

  font-size:21px;

  font-weight:900;

  color:#fff;

  background:#070d13;

  border:1px solid rgba(255,255,255,.12);

  border-radius:11px;

  outline:none;
}

.score-input:focus{
  border-color:rgba(50,170,255,.6);
}

.score-input:disabled{
  color:#7f8a95;
  background:#0a0f14;
  cursor:not-allowed;
}

.save-game{
  width:100%;

  margin-top:11px;

  padding:11px 8px;

  border:0;

  border-radius:10px;

  background:#146da8;

  color:#fff;

  font-weight:800;

  cursor:pointer;
}

.save-game:disabled{
  opacity:.4;
  cursor:not-allowed;
}

/* =====================================
   TOTAL
===================================== */

.total-box{
  margin-top:16px;

  padding:17px;

  border-radius:14px;

  background:rgba(255,255,255,.05);

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.total-label{
  color:#9aa6b2;
  font-size:13px;
}

.total-value{
  font-size:27px;
  font-weight:900;
}

/* =====================================
   MESSAGE
===================================== */

.message{
  display:none;

  margin-top:15px;

  padding:12px 14px;

  border-radius:11px;

  font-size:13px;

  line-height:1.45;

  background:rgba(255,255,255,.06);
}

.message.show{
  display:block;
}

.message.success{
  color:#7ee29a;
}

.message.error{
  color:#ff8e8e;
}

/* =====================================
   LOGOUT / HOME
===================================== */

.bottom-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:16px;
}

.secondary{
  display:flex;
  align-items:center;
  justify-content:center;

  text-decoration:none;

  color:#c5ced7;

  background:rgba(255,255,255,.055);

  border:1px solid rgba(255,255,255,.10);

  border-radius:12px;

  padding:13px;

  font-size:13px;

  font-weight:800;

  cursor:pointer;
}

.secondary:hover{
  background:rgba(255,255,255,.09);
}

/* =====================================
   HIDDEN
===================================== */

.hidden{
  display:none !important;
}

/* =====================================
   LOADING
===================================== */

.loading{
  text-align:center;
  color:#8e9aa6;
  padding:20px;
  font-size:13px;
}

/* =====================================
   MOBILE
===================================== */

@media(max-width:650px){

  .title{
    font-size:23px;
  }

  .team-name{
    font-size:21px;
  }

  .games{
    grid-template-columns:1fr;
  }

  .game-box{
    padding:16px;
  }

  .bottom-buttons{
    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>


<!-- =====================================
     HEADER
===================================== -->

<header class="header">

  <img
    class="logo"
    src="https://raw.githubusercontent.com/mieyaziz/recron-bowling-overlay/main/recron-logo.png"
    alt="RECRON Logo"
  >

  <h1 class="title">
    Score Entry Ketua Kumpulan
  </h1>

  <div class="subtitle">
    RECRON Bowling Tournament 2026
  </div>

</header>


<!-- =====================================
     MAIN
===================================== -->

<main class="container">


  <!-- ===================================
       LOGIN CARD
  ==================================== -->

  <section
    id="loginSection"
    class="card login-card"
  >

    <label class="label">
      Username
    </label>

    <input
      id="username"
      class="input"
      type="text"
      autocomplete="username"
      placeholder="Masukkan username"
    >

    <label class="label">
      Password
    </label>

    <input
      id="password"
      class="input"
      type="password"
      autocomplete="current-password"
      placeholder="Masukkan password"
    >

    <button
      id="loginBtn"
      class="button"
      onclick="login()"
    >
      🔐 LOGIN
    </button>

    <div
      id="loginMessage"
      class="message"
    ></div>

  </section>


  <!-- ===================================
       SCORE SECTION
  ==================================== -->

  <section
    id="scoreSection"
    class="hidden"
  >


    <!-- TEAM -->

    <div class="card">

      <div class="team-header">

        <div>

          <div class="team-label">
            TEAM ANDA
          </div>

          <div
            id="teamName"
            class="team-name"
          >
            -
          </div>

          <div
            id="leaderName"
            class="leader-name"
          >
            -
          </div>

        </div>

        <div class="lock-team">
          🔒 Team Dikunci
        </div>

      </div>

    </div>


    <!-- PLAYER + SCORE -->

    <div class="card">

      <div class="player-title">
        PILIH PEMAIN
      </div>

      <select
        id="playerSelect"
        class="player-select"
        onchange="loadSelectedPlayer()"
      >

        <option value="">
          -- Pilih Pemain --
        </option>

      </select>


      <div
        id="playerLoading"
        class="loading hidden"
      >
        Memuatkan score...
      </div>


      <!-- GAMES -->

      <div
        id="gamesContainer"
        class="games"
      >


        <!-- GAME 1 -->

        <div
          id="gameBox1"
          class="game-box"
        >

          <div class="game-label">
            GAME 1
          </div>

          <div
            id="status1"
            class="game-status locked"
          >
            🔐 Belum aktif
          </div>

          <input
            id="score1"
            class="score-input"
            type="number"
            min="0"
            max="300"
            inputmode="numeric"
            disabled
            placeholder="-"
          >

          <button
            id="save1"
            class="save-game"
            onclick="saveGame(1)"
            disabled
          >
            SIMPAN G1
          </button>

        </div>


        <!-- GAME 2 -->

        <div
          id="gameBox2"
          class="game-box"
        >

          <div class="game-label">
            GAME 2
          </div>

          <div
            id="status2"
            class="game-status locked"
          >
            🔐 Belum aktif
          </div>

          <input
            id="score2"
            class="score-input"
            type="number"
            min="0"
            max="300"
            inputmode="numeric"
            disabled
            placeholder="-"
          >

          <button
            id="save2"
            class="save-game"
            onclick="saveGame(2)"
            disabled
          >
            SIMPAN G2
          </button>

        </div>


        <!-- GAME 3 -->

        <div
          id="gameBox3"
          class="game-box"
        >

          <div class="game-label">
            GAME 3
          </div>

          <div
            id="status3"
            class="game-status locked"
          >
            🔐 Belum aktif
          </div>

          <input
            id="score3"
            class="score-input"
            type="number"
            min="0"
            max="300"
            inputmode="numeric"
            disabled
            placeholder="-"
          >

          <button
            id="save3"
            class="save-game"
            onclick="saveGame(3)"
            disabled
          >
            SIMPAN G3
          </button>

        </div>


      </div>


      <!-- TOTAL -->

      <div class="total-box">

        <div class="total-label">
          JUMLAH SCORE
        </div>

        <div
          id="totalValue"
          class="total-value"
        >
          0
        </div>

      </div>


      <div
        id="scoreMessage"
        class="message"
      ></div>


    </div>


    <!-- BUTTONS -->

    <div class="bottom-buttons">

      <button
        class="secondary"
        onclick="logout()"
      >
        🚪 Logout
      </button>

      <a
        class="secondary"
        href="./index.html"
      >
        🏠 Home
      </a>

    </div>


  </section>


</main>


<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbwW8_FQ12mi6iQqfZaXbZ7C0qDm5_hR--lSDwYzWGixBu-APdxAxgImby7ZeVkwbRVO/exec";


/* =====================================================
   STATE
===================================================== */

let token =
  localStorage.getItem("teamLeaderToken") || "";

let currentTeam = "";

let currentLeader = "";

let players = [];

let currentPlayer = "";

let currentScores = {
  g1: "",
  g2: "",
  g3: ""
};


/* =====================================================
   JSONP HELPER
===================================================== */

function jsonp(page, params = {}) {

  return new Promise((resolve, reject) => {

    const callbackName =
      "jsonp_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 100000);

    const script =
      document.createElement("script");

    const query =
      new URLSearchParams();

    query.set("page", page);
    query.set("callback", callbackName);

    Object.keys(params).forEach(key => {

      const value = params[key];

      if (
        value !== undefined &&
        value !== null
      ) {

        query.set(
          key,
          String(value)
        );

      }

    });


    const timer =
      setTimeout(() => {

        cleanup();

        reject(
          new Error(
            "Connection timeout."
          )
        );

      }, 20000);


    function cleanup(){

      clearTimeout(timer);

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      try{
        delete window[callbackName];
      }catch(e){}

    }


    window[callbackName] =
      function(data){

        cleanup();

        resolve(data);

      };


    script.onerror =
      function(){

        cleanup();

        reject(
          new Error(
            "API connection failed."
          )
        );

      };


    script.src =
      API_URL +
      "?" +
      query.toString();


    document.body.appendChild(script);

  });

}


/* =====================================================
   INIT
===================================================== */

window.addEventListener(
  "DOMContentLoaded",
  function(){

    if(token){

      restoreSession();

    }

  }
);


/* =====================================================
   LOGIN
===================================================== */

async function login(){

  const username =
    document
      .getElementById("username")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;


  if(!username || !password){

    showMessage(
      "loginMessage",
      "Sila masukkan username dan password.",
      "error"
    );

    return;

  }


  const btn =
    document.getElementById("loginBtn");

  btn.disabled = true;
  btn.textContent = "⏳ LOGIN...";


  try{

    const result =
      await jsonp(
        "api_teamleader_login",
        {
          username:username,
          password:password
        }
      );


    if(!result || !result.success){

      throw new Error(
        result?.message ||
        "Login gagal."
      );

    }


    token =
      result.token;

    localStorage.setItem(
      "teamLeaderToken",
      token
    );


    currentTeam =
      result.team || "";

    currentLeader =
      result.namaKetua || result.username || "";


    await openScoreSection();


  }catch(error){

    showMessage(
      "loginMessage",
      error.message ||
      "Login gagal.",
      "error"
    );

  }finally{

    btn.disabled = false;
    btn.textContent = "🔐 LOGIN";

  }

}


/* =====================================================
   RESTORE SESSION
===================================================== */

async function restoreSession(){

  try{

    const result =
      await jsonp(
        "api_teamleader_players",
        {
          token:token
        }
      );


    if(!result || !result.success){

      logout();

      return;

    }


    currentTeam =
      result.team || "";

    currentLeader =
      result.leader ||
      result.namaKetua ||
      result.username ||
      "";


    await openScoreSection();


  }catch(error){

    logout();

  }

}


/* =====================================================
   OPEN SCORE SECTION
===================================================== */

async function openScoreSection(){

  document
    .getElementById("loginSection")
    .classList
    .add("hidden");


  document
    .getElementById("scoreSection")
    .classList
    .remove("hidden");


  document
    .getElementById("teamName")
    .textContent =
      currentTeam || "-";


  document
    .getElementById("leaderName")
    .textContent =
      currentLeader
        ? "Ketua: " + currentLeader
        : "";


  await loadPlayers();

}


/* =====================================================
   LOAD PLAYERS
===================================================== */

async function loadPlayers(){

  try{

    const result =
      await jsonp(
        "api_teamleader_players",
        {
          token:token
        }
      );


    if(!result || !result.success){

      throw new Error(
        result?.message ||
        "Gagal mendapatkan senarai pemain."
      );

    }


    players =
      Array.isArray(result.players)
        ? result.players
        : [];


    const select =
      document.getElementById(
        "playerSelect"
      );


    select.innerHTML =
      '<option value="">-- Pilih Pemain --</option>';


    players.forEach(function(player){

      const option =
        document.createElement("option");

      option.value =
        player.nama;

      option.textContent =
        player.nama;

      select.appendChild(option);

    });


  }catch(error){

    showMessage(
      "scoreMessage",
      error.message ||
      "Gagal mendapatkan pemain.",
      "error"
    );

  }

}


/* =====================================================
   LOAD SELECTED PLAYER
===================================================== */

async function loadSelectedPlayer(){

  const select =
    document.getElementById(
      "playerSelect"
    );

  const nama =
    select.value;


  currentPlayer =
    nama;


  resetGameUI();


  if(!nama){

    return;

  }


  const loading =
    document.getElementById(
      "playerLoading"
    );

  loading.classList.remove(
    "hidden"
  );


  try{

    const result =
      await jsonp(
        "api_score_get",
        {
          token:token,
          nama:nama
        }
      );


    if(
      result &&
      result.success &&
      result.score
    ){

      currentScores = {

        g1:
          normaliseScore(
            result.score.g1
          ),

        g2:
          normaliseScore(
            result.score.g2
          ),

        g3:
          normaliseScore(
            result.score.g3
          )

      };

    }else{

      currentScores = {
        g1:"",
        g2:"",
        g3:""
      };

    }


    renderGames();


  }catch(error){

    showMessage(
      "scoreMessage",
      error.message ||
      "Gagal membaca score pemain.",
      "error"
    );

  }finally{

    loading.classList.add(
      "hidden"
    );

  }

}


/* =====================================================
   NORMALISE SCORE
===================================================== */

function normaliseScore(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return "";

  }

  return Number(value);

}


/* =====================================================
   RESET UI
===================================================== */

function resetGameUI(){

  currentScores = {
    g1:"",
    g2:"",
    g3:""
  };


  for(let i=1;i<=3;i++){

    const input =
      document.getElementById(
        "score" + i
      );

    const button =
      document.getElementById(
        "save" + i
      );

    const box =
      document.getElementById(
        "gameBox" + i
      );

    const status =
      document.getElementById(
        "status" + i
      );


    input.value = "";

    input.disabled = true;

    button.disabled = true;

    box.classList.remove(
      "active",
      "locked"
    );

    status.className =
      "game-status locked";

    status.textContent =
      "🔐 Belum aktif";

  }


  document
    .getElementById("totalValue")
    .textContent = "0";


  document
    .getElementById("scoreMessage")
    .className =
      "message";

}


/* =====================================================
   RENDER GAME STATUS
===================================================== */

function renderGames(){

  const scores =
    currentScores;


  const hasG1 =
    scores.g1 !== "" &&
    scores.g1 !== null &&
    scores.g1 !== undefined;


  const hasG2 =
    scores.g2 !== "" &&
    scores.g2 !== null &&
    scores.g2 !== undefined;


  const hasG3 =
    scores.g3 !== "" &&
    scores.g3 !== null &&
    scores.g3 !== undefined;


  /* ---------------------------------------------
     SET VALUES
  --------------------------------------------- */

  document
    .getElementById("score1")
    .value =
      hasG1 ? scores.g1 : "";

  document
    .getElementById("score2")
    .value =
      hasG2 ? scores.g2 : "";

  document
    .getElementById("score3")
    .value =
      hasG3 ? scores.g3 : "";


  /* ---------------------------------------------
     GAME 1
  --------------------------------------------- */

  if(hasG1){

    setGameState(
      1,
      "saved",
      "🔒 Disimpan",
      true
    );

  }else{

    setGameState(
      1,
      "active",
      "🎳 Aktif",
      false
    );

  }


  /* ---------------------------------------------
     GAME 2
  --------------------------------------------- */

  if(hasG2){

    setGameState(
      2,
      "saved",
      "🔒 Disimpan",
      true
    );

  }else if(hasG1){

    setGameState(
      2,
      "active",
      "🎳 Aktif",
      false
    );

  }else{

    setGameState(
      2,
      "locked",
      "🔐 Tunggu Game 1",
      false
    );

  }


  /* ---------------------------------------------
     GAME 3
  --------------------------------------------- */

  if(hasG3){

    setGameState(
      3,
      "saved",
      "🔒 Disimpan",
      true
    );

  }else if(hasG2){

    setGameState(
      3,
      "active",
      "🎳 Aktif",
      false
    );

  }else{

    setGameState(
      3,
      "locked",
      "🔐 Tunggu Game 2",
      false
    );

  }


  /* ---------------------------------------------
     TOTAL
  --------------------------------------------- */

  const total =
    (Number(scores.g1) || 0) +
    (Number(scores.g2) || 0) +
    (Number(scores.g3) || 0);


  document
    .getElementById("totalValue")
    .textContent =
      total;


  /* ---------------------------------------------
     COMPLETE
  --------------------------------------------- */

  if(
    hasG1 &&
    hasG2 &&
    hasG3
  ){

    showMessage(
      "scoreMessage",
      "✅ Semua 3 game untuk pemain ini telah selesai.",
      "success"
    );

  }

}


/* =====================================================
   SET GAME STATE
===================================================== */

function setGameState(
  gameNo,
  state,
  text,
  saved
){

  const box =
    document.getElementById(
      "gameBox" + gameNo
    );

  const status =
    document.getElementById(
      "status" + gameNo
    );

  const input =
    document.getElementById(
      "score" + gameNo
    );

  const button =
    document.getElementById(
      "save" + gameNo
    );


  box.classList.remove(
    "active",
    "locked"
  );


  status.className =
    "game-status";


  if(state === "active"){

    box.classList.add(
      "active"
    );

    status.classList.add(
      "active"
    );

    input.disabled = false;

    button.disabled = false;

  }


  else if(state === "saved"){

    box.classList.add(
      "locked"
    );

    status.classList.add(
      "saved"
    );

    input.disabled = true;

    button.disabled = true;

  }


  else{

    box.classList.add(
      "locked"
    );

    status.classList.add(
      "locked"
    );

    input.disabled = true;

    button.disabled = true;

  }


  status.textContent =
    text;

}


/* =====================================================
   SAVE GAME
===================================================== */

async function saveGame(gameNo){

  if(!currentPlayer){

    showMessage(
      "scoreMessage",
      "Sila pilih pemain dahulu.",
      "error"
    );

    return;

  }


  const input =
    document.getElementById(
      "score" + gameNo
    );


  const button =
    document.getElementById(
      "save" + gameNo
    );


  const rawValue =
    input.value;


  /*
   * Penting:
   * 0 dianggap valid.
   */

  if(
    rawValue === "" ||
    rawValue === null ||
    rawValue === undefined
  ){

    showMessage(
      "scoreMessage",
      "Sila masukkan score Game " + gameNo + ".",
      "error"
    );

    input.focus();

    return;

  }


  const score =
    Number(rawValue);


  if(
    isNaN(score) ||
    score < 0 ||
    score > 300
  ){

    showMessage(
      "scoreMessage",
      "Score mesti antara 0 hingga 300.",
      "error"
    );

    input.focus();

    return;

  }


  button.disabled = true;

  button.textContent =
    "⏳ SIMPAN...";


  try{

    const result =
      await jsonp(
        "api_teamleader_save_game",
        {
          token:token,
          nama:currentPlayer,
          game:gameNo,
          score:score
        }
      );


    if(!result || !result.success){

      if(
        result &&
        result.locked
      ){

        throw new Error(
          result.message ||
          "Game sudah dikunci."
        );

      }

      throw new Error(
        result?.message ||
        "Gagal menyimpan score."
      );

    }


    /* ---------------------------------------------
       UPDATE LOCAL SCORE
    --------------------------------------------- */

    if(gameNo === 1){
      currentScores.g1 = score;
    }

    if(gameNo === 2){
      currentScores.g2 = score;
    }

    if(gameNo === 3){
      currentScores.g3 = score;
    }


    renderGames();


    showMessage(
      "scoreMessage",
      "✅ Game " +
        gameNo +
        " berjaya disimpan untuk " +
        currentPlayer +
        ".",
      "success"
    );


  }catch(error){

    showMessage(
      "scoreMessage",
      error.message ||
      "Gagal menyimpan score.",
      "error"
    );


    /*
     * Refresh data daripada server
     * supaya UI tidak tersalah anggap
     * game sudah/ belum disimpan.
     */

    try{

      await loadSelectedPlayer();

    }catch(e){}

  }finally{

    button.textContent =
      "SIMPAN G" + gameNo;

  }

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  elementId,
  text,
  type
){

  const element =
    document.getElementById(
      elementId
    );


  element.textContent =
    text;


  element.className =
    "message show " +
    (type || "");


}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

  localStorage.removeItem(
    "teamLeaderToken"
  );


  token = "";

  currentTeam = "";

  currentLeader = "";

  players = [];

  currentPlayer = "";


  document
    .getElementById("scoreSection")
    .classList
    .add("hidden");


  document
    .getElementById("loginSection")
    .classList
    .remove("hidden");


  document
    .getElementById("username")
    .value = "";


  document
    .getElementById("password")
    .value = "";


  document
    .getElementById("playerSelect")
    .innerHTML =
      '<option value="">-- Pilih Pemain --</option>';


  resetGameUI();

}
