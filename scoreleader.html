<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Score Entry Ketua Kumpulan</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;

  background:
    radial-gradient(
      circle at 15% 20%,
      rgba(0,104,180,.22),
      transparent 32%
    ),
    radial-gradient(
      circle at 85% 75%,
      rgba(0,90,180,.18),
      transparent 30%
    ),
    linear-gradient(
      135deg,
      #07111b 0%,
      #0a1520 48%,
      #03070c 100%
    );
}

body{
  min-height:100vh;
  overflow-x:hidden;
}

/* =====================================================
   BACKGROUND EFFECT
===================================================== */

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;

  background:
    linear-gradient(
      120deg,
      transparent 0%,
      rgba(0,126,255,.05) 45%,
      transparent 60%
    );

  z-index:-1;
}


/* =====================================================
   HEADER
===================================================== */

.header{
  width:min(1000px,94%);
  margin:0 auto;

  text-align:center;

  padding:32px 0 22px;
}

.logo{
  display:block;

  width:125px;
  max-width:42vw;

  height:auto;

  object-fit:contain;

  margin:0 auto 12px;

  filter:
    drop-shadow(0 0 18px rgba(0,150,255,.18));
}

.title{
  margin:0;

  font-size:30px;

  font-weight:900;

  letter-spacing:.3px;

  text-shadow:
    0 3px 15px rgba(0,0,0,.45);
}

.subtitle{
  margin-top:7px;

  color:#91a8bc;

  font-size:13px;

  letter-spacing:1.5px;
}


/* =====================================================
   MAIN
===================================================== */

.container{
  width:min(850px,94%);

  margin:0 auto;

  padding-bottom:45px;
}


/* =====================================================
   CARD
===================================================== */

.card{

  background:
    linear-gradient(
      145deg,
      rgba(22,39,55,.88),
      rgba(10,17,24,.90)
    );

  border:
    1px solid rgba(255,255,255,.09);

  border-radius:20px;

  padding:20px;

  margin-bottom:14px;

  box-shadow:
    0 18px 45px rgba(0,0,0,.28);

  backdrop-filter:blur(8px);
}


/* =====================================================
   LOGIN
===================================================== */

.login-card{
  max-width:460px;
  margin:0 auto;
}

.label{
  display:block;

  font-size:12px;

  color:#9caebe;

  margin-bottom:7px;
}

.input{
  width:100%;

  padding:14px 15px;

  margin-bottom:13px;

  border-radius:12px;

  border:
    1px solid rgba(255,255,255,.10);

  background:#071019;

  color:#fff;

  font-size:15px;

  outline:none;
}

.input:focus{
  border-color:#1599e8;

  box-shadow:
    0 0 0 2px rgba(21,153,232,.10);
}

.button{
  width:100%;

  border:0;

  border-radius:12px;

  padding:14px;

  background:
    linear-gradient(
      135deg,
      #1599e8,
      #0764a4
    );

  color:#fff;

  font-size:15px;

  font-weight:900;

  cursor:pointer;
}

.button:hover{
  filter:brightness(1.08);
}

.button:disabled{
  opacity:.55;
  cursor:not-allowed;
}


/* =====================================================
   TEAM
===================================================== */

.team-header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;

  flex-wrap:wrap;
}

.team-label{

  color:#8299ad;

  font-size:11px;

  font-weight:700;

  letter-spacing:.8px;

  margin-bottom:5px;
}

.team-name{

  font-size:27px;

  font-weight:900;
}

.leader-name{

  margin-top:4px;

  color:#9db1c3;

  font-size:13px;
}

.lock-team{

  padding:10px 13px;

  border-radius:10px;

  background:
    rgba(255,255,255,.055);

  border:
    1px solid rgba(255,255,255,.07);

  color:#b8c5d0;

  font-size:12px;

  font-weight:700;
}


/* =====================================================
   PLAYER
===================================================== */

.player-title{

  font-size:13px;

  font-weight:900;

  letter-spacing:.5px;

  margin-bottom:8px;
}

.player-select{

  width:100%;

  padding:15px;

  border-radius:12px;

  border:
    1px solid rgba(255,255,255,.11);

  background:#071019;

  color:#fff;

  font-size:15px;

  outline:none;

  cursor:pointer;
}

.player-select:focus{

  border-color:#1599e8;

  box-shadow:
    0 0 0 2px rgba(21,153,232,.10);
}


/* =====================================================
   GAMES
===================================================== */

.games{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;

  margin-top:16px;
}

.game-box{

  min-width:0;

  border-radius:16px;

  padding:14px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.045),
      rgba(255,255,255,.018)
    );

  border:
    1px solid rgba(255,255,255,.07);

  transition:.2s;
}

.game-box.active{

  border-color:
    rgba(20,160,245,.75);

  background:
    linear-gradient(
      145deg,
      rgba(12,103,164,.27),
      rgba(255,255,255,.025)
    );

  box-shadow:
    0 0 22px rgba(0,140,240,.10);
}

.game-box.saved{

  border-color:
    rgba(72,190,115,.30);

  background:
    linear-gradient(
      145deg,
      rgba(45,120,75,.14),
      rgba(255,255,255,.025)
    );
}

.game-box.locked{

  opacity:.58;
}

.game-label{

  font-size:12px;

  font-weight:900;

  letter-spacing:.5px;

  color:#a9b8c6;

  margin-bottom:6px;
}

.game-status{

  min-height:17px;

  font-size:11px;

  color:#768694;

  margin-bottom:9px;
}

.game-status.active{
  color:#5fc4ff;
}

.game-status.saved{
  color:#6fdb92;
}

.game-status.locked{
  color:#75828e;
}


/* =====================================================
   SCORE INPUT
===================================================== */

.score-input{

  width:100%;

  height:58px;

  padding:5px 8px;

  text-align:center;

  border-radius:11px;

  border:
    1px solid rgba(255,255,255,.08);

  background:#03080d;

  color:#fff;

  font-size:29px;

  font-weight:900;

  outline:none;

  appearance:textfield;

  -moz-appearance:textfield;
}

.score-input::-webkit-outer-spin-button,
.score-input::-webkit-inner-spin-button{
  opacity:.7;
}

.score-input::placeholder{
  color:#67727c;
}

.score-input:focus{

  border-color:#169bea;

  box-shadow:
    0 0 0 2px rgba(22,155,234,.10);
}

.score-input:disabled{

  color:#fff;

  background:#050b11;

  cursor:not-allowed;

  opacity:1;
}


/* =====================================================
   SAVE BUTTON
===================================================== */

.save-game{

  width:100%;

  margin-top:9px;

  padding:11px 5px;

  border:0;

  border-radius:10px;

  background:
    linear-gradient(
      135deg,
      #1599e8,
      #0870b2
    );

  color:#fff;

  font-size:12px;

  font-weight:900;

  cursor:pointer;

  transition:.15s;
}

.save-game:hover:not(:disabled){

  transform:translateY(-1px);

  filter:brightness(1.08);
}

.save-game:disabled{

  opacity:.35;

  cursor:not-allowed;

  background:#17516f;
}


/* =====================================================
   TOTAL
===================================================== */

.total-box{

  margin-top:14px;

  padding:16px 18px;

  border-radius:14px;

  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.035)
    );

  border:
    1px solid rgba(255,255,255,.06);

  display:flex;

  align-items:center;

  justify-content:space-between;
}

.total-label{

  color:#9badbd;

  font-size:12px;

  font-weight:700;
}

.total-value{

  font-size:29px;

  font-weight:900;

  color:#fff;

  text-shadow:
    0 0 14px rgba(255,255,255,.10);
}


/* =====================================================
   MESSAGE
===================================================== */

.message{

  display:none;

  margin-top:13px;

  padding:12px 14px;

  border-radius:10px;

  font-size:12px;

  line-height:1.45;

  background:
    rgba(255,255,255,.045);

  border:
    1px solid rgba(255,255,255,.06);
}

.message.show{
  display:block;
}

.message.success{
  color:#7ce09a;
}

.message.error{
  color:#ff8f8f;
}


/* =====================================================
   BOTTOM BUTTONS
===================================================== */

.bottom-buttons{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;

  margin-top:14px;
}

.secondary{

  display:flex;

  align-items:center;

  justify-content:center;

  min-height:44px;

  text-decoration:none;

  color:#d0d8df;

  background:
    rgba(255,255,255,.045);

  border:
    1px solid rgba(255,255,255,.08);

  border-radius:11px;

  font-size:13px;

  font-weight:800;

  cursor:pointer;
}

.secondary:hover{

  background:
    rgba(255,255,255,.08);

  border-color:
    rgba(255,255,255,.15);
}


/* =====================================================
   LOADING
===================================================== */

.loading{

  text-align:center;

  color:#8fa1af;

  padding:16px;

  font-size:12px;
}


/* =====================================================
   HIDDEN
===================================================== */

.hidden{
  display:none !important;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

  .header{
    padding-top:25px;
  }

  .logo{
    width:105px;
  }

  .title{
    font-size:23px;
  }

  .subtitle{
    font-size:11px;
  }

  .container{
    width:94%;
  }

  .card{
    padding:16px;
    border-radius:16px;
  }

  .team-name{
    font-size:23px;
  }

  .games{
    grid-template-columns:1fr;
  }

  .game-box{
    padding:15px;
  }

  .score-input{
    height:62px;
    font-size:31px;
  }

  .bottom-buttons{
    grid-template-columns:1fr;
  }

}


/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media(max-width:380px){

  .title{
    font-size:20px;
  }

  .team-name{
    font-size:21px;
  }

  .score-input{
    font-size:28px;
  }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <img
    class="logo"
    src="./recron-logo.png"
    alt="RECRON Logo"
    onerror="
      if(!this.dataset.fallback){
        this.dataset.fallback='1';
        this.src='https://raw.githubusercontent.com/mieyaziz/recron-bowling-overlay/main/recron-logo.png';
      }
    "
  >

  <h1 class="title">
    Score Entry Ketua Kumpulan
  </h1>

  <div class="subtitle">
    RECRON Bowling Tournament 2026
  </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">


  <!-- ===================================================
       LOGIN
  ==================================================== -->

  <section
    id="loginSection"
    class="card login-card"
  >

    <label class="label">
      Username
    </label>

    <input
      id="username"
      class="input"
      type="text"
      autocomplete="username"
      placeholder="Masukkan username"
    >

    <label class="label">
      Password
    </label>

    <input
      id="password"
      class="input"
      type="password"
      autocomplete="current-password"
      placeholder="Masukkan password"
    >

    <button
      id="loginBtn"
      class="button"
      onclick="login()"
    >
      🔐 LOGIN
    </button>

    <div
      id="loginMessage"
      class="message"
    ></div>

  </section>


  <!-- ===================================================
       SCORE SECTION
  ==================================================== -->

  <section
    id="scoreSection"
    class="hidden"
  >


    <!-- TEAM -->

    <div class="card">

      <div class="team-header">

        <div>

          <div class="team-label">
            TEAM ANDA
          </div>

          <div
            id="teamName"
            class="team-name"
          >
            -
          </div>

          <div
            id="leaderName"
            class="leader-name"
          >
            -
          </div>

        </div>

        <div class="lock-team">
          🔒 Team Dikunci
        </div>

      </div>

    </div>


    <!-- PLAYER / GAMES -->

    <div class="card">

      <div class="player-title">
        PILIH PEMAIN

      <select
        id="playerSelect"
        class="player-select"

      >

        <option value="">
          -- Pilih Pemain --
        </option>

      </select>


      <div
        id="playerLoading"
        class="loading hidden"
      >
        Memuatkan score...
      </div>


      <!-- GAMES -->

      <div
        id="gamesContainer"
        class="games"
      >


        <!-- GAME 1 -->

        <div
          id="gameBox1"
          class="game-box"
        >

          <div class="game-label">
            GAME 1
          </div>

          <div
            id="status1"
            class="game-status locked"
          >
            🔐 Belum aktif
          </div>

          <input
            id="score1"
            class="score-input"
            type="number"
            min="0"
            max="300"
            inputmode="numeric"
            placeholder="-"
            disabled
          >

          <button
            id="save1"
            class="save-game"
            onclick="saveGame(1)"
            disabled
          >
            💾 SIMPAN G1
          </button>

        </div>


        <!-- GAME 2 -->

        <div
          id="gameBox2"
          class="game-box"
        >

          <div class="game-label">
            GAME 2
          </div>

          <div
            id="status2"
            class="game-status locked"
          >
            🔐 Tunggu Game 1
          </div>

          <input
            id="score2"
            class="score-input"
            type="number"
            min="0"
            max="300"
            inputmode="numeric"
            placeholder="-"
            disabled
          >

          <button
            id="save2"
            class="save-game"
            onclick="saveGame(2)"
            disabled
          >
            💾 SIMPAN G2
          </button>

        </div>


        <!-- GAME 3 -->

        <div
          id="gameBox3"
          class="game-box"
        >

          <div class="game-label">
            GAME 3
          </div>

          <div
            id="status3"
            class="game-status locked"
          >
            🔐 Tunggu Game 2
          </div>

          <input
            id="score3"
            class="score-input"
            type="number"
            min="0"
            max="300"
            inputmode="numeric"
            placeholder="-"
            disabled
          >

          <button
            id="save3"
            class="save-game"
            onclick="saveGame(3)"
            disabled
          >
            💾 SIMPAN G3
          </button>

        </div>


      </div>


      <!-- TOTAL -->

      <div class="total-box">

        <div class="total-label">
          📊 JUMLAH SCORE
        </div>

        <div
          id="totalValue"
          class="total-value"
        >
          0
        </div>

      </div>


      <div
        id="scoreMessage"
        class="message"
      ></div>


    </div>


    <!-- BUTTONS -->

    <div class="bottom-buttons">

      <button
        class="secondary"
        onclick="logout()"
      >
        🚪 Logout
      </button>

      <a
        class="secondary"
        href="./index.html"
      >
        🏠 Home
      </a>

    </div>


  </section>


</main>


<script>

/* =====================================================
   API
===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbwW8_FQ12mi6iQqfZaXbZ7C0qDm5_hR--lSDwYzWGixBu-APdxAxgImby7ZeVkwbRVO/exec";


/* =====================================================
   STATE
===================================================== */

let token =
  localStorage.getItem("teamLeaderToken") || "";

let currentTeam = "";

let currentLeader = "";

let players = [];

let currentPlayer = "";

let currentScores = {
  g1:"",
  g2:"",
  g3:""
};


/* =====================================================
   JSONP
===================================================== */

function jsonp(page, params = {}){

  return new Promise((resolve,reject)=>{

    const callbackName =
      "jsonp_" +
      Date.now() +
      "_" +
      Math.floor(
        Math.random() * 100000
      );

    const script =
      document.createElement("script");

    const query =
      new URLSearchParams();

    query.set(
      "page",
      page
    );

    query.set(
      "callback",
      callbackName
    );


    Object.keys(params).forEach(key=>{

      const value =
        params[key];

      if(
        value !== undefined &&
        value !== null
      ){

        query.set(
          key,
          String(value)
        );

      }

    });


    const timer =
      setTimeout(()=>{

        cleanup();

        reject(
          new Error(
            "Connection timeout."
          )
        );

      },20000);


    function cleanup(){

      clearTimeout(timer);

      if(script.parentNode){

        script.parentNode
          .removeChild(script);

      }

      try{

        delete window[callbackName];

      }catch(e){}

    }


    window[callbackName] =
      function(data){

        cleanup();

        resolve(data);

      };


    script.onerror =
      function(){

        cleanup();

        reject(
          new Error(
            "API connection failed."
          )
        );

      };


    script.src =
      API_URL +
      "?" +
      query.toString();


    document.body
      .appendChild(script);

  });

}


/* =====================================================
   INIT
===================================================== */

window.addEventListener(
  "DOMContentLoaded",
  function(){

    if(token){

      restoreSession();

    }

  }
);


/* =====================================================
   LOGIN
===================================================== */

async function login(){

  const username =
    document
      .getElementById("username")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;


  if(!username || !password){

    showMessage(
      "loginMessage",
      "Sila masukkan username dan password.",
      "error"
    );

    return;

  }


  const btn =
    document.getElementById(
      "loginBtn"
    );

  btn.disabled = true;

  btn.textContent =
    "⏳ LOGIN...";


  try{

    const result =
      await jsonp(
        "api_teamleader_login",
        {
          username:username,
          password:password
        }
      );


    if(
      !result ||
      !result.success
    ){

      throw new Error(
        result?.message ||
        "Login gagal."
      );

    }


    token =
      result.token;

    localStorage.setItem(
      "teamLeaderToken",
      token
    );


    currentTeam =
      result.team || "";

    currentLeader =
      result.namaKetua ||
      result.username ||
      "";


    await openScoreSection();


  }catch(error){

    showMessage(
      "loginMessage",
      error.message ||
      "Login gagal.",
      "error"
    );

  }finally{

    btn.disabled = false;

    btn.textContent =
      "🔐 LOGIN";

  }

}


/* =====================================================
   RESTORE
===================================================== */

async function restoreSession(){

  try{

    const result =
      await jsonp(
        "api_teamleader_players",
        {
          token:token
        }
      );


    if(
      !result ||
      !result.success
    ){

      logout();

      return;

    }


    currentTeam =
      result.team || "";

    currentLeader =
      result.leader ||
      result.namaKetua ||
      result.username ||
      "";


    await openScoreSection();


  }catch(error){

    logout();

  }

}


/* =====================================================
   OPEN
===================================================== */

async function openScoreSection(){

  document
    .getElementById("loginSection")
    .classList
    .add("hidden");


  document
    .getElementById("scoreSection")
    .classList
    .remove("hidden");


  document
    .getElementById("teamName")
    .textContent =
      currentTeam || "-";


  document
    .getElementById("leaderName")
    .textContent =
      currentLeader
        ? "Ketua: " + currentLeader
        : "";


  await loadPlayers();

}


/* =====================================================
   LOAD PLAYERS
===================================================== */

async function loadPlayers(){

  try{

    const result =
      await jsonp(
        "api_teamleader_players",
        {
          token:token
        }
      );


    if(
      !result ||
      !result.success
    ){

      throw new Error(
        result?.message ||
        "Gagal mendapatkan senarai pemain."
      );

    }


    players =
      Array.isArray(result.players)
        ? result.players
        : [];


    const select =
      document.getElementById(
        "playerSelect"
      );


    select.innerHTML =
      '<option value="">-- Pilih Pemain --</option>';


    players.forEach(player=>{

      const option =
        document.createElement("option");

      option.value =
        player.nama;

      option.textContent =
        player.nama;

      select.appendChild(option);

    });


  }catch(error){

    showMessage(
      "scoreMessage",
      error.message ||
      "Gagal mendapatkan pemain.",
      "error"
    );

  }

}


/* =====================================================
   LOAD PLAYER SCORE
===================================================== */

async function loadSelectedPlayer(){

  const select =
    document.getElementById(
      "playerSelect"
    );

  const nama =
    select.value;


  currentPlayer =
    nama;


  resetGameUI();


  if(!nama){

    return;

  }


  const loading =
    document.getElementById(
      "playerLoading"
    );

  loading.classList.remove(
    "hidden"
  );


  try{

    const result =
      await jsonp(
        "api_score_get",
        {
          token:token,
          nama:nama
        }
      );


    if(
      result &&
      result.success &&
      result.score
    ){

      currentScores = {

        g1:
          normaliseScore(
            result.score.g1
          ),

        g2:
          normaliseScore(
            result.score.g2
          ),

        g3:
          normaliseScore(
            result.score.g3
          )

      };

    }else{

      currentScores = {
        g1:"",
        g2:"",
        g3:""
      };

    }


    renderGames();


  }catch(error){

    showMessage(
      "scoreMessage",
      error.message ||
      "Gagal membaca score pemain.",
      "error"
    );

  }finally{

    loading.classList.add(
      "hidden"
    );

  }

}


/* =====================================================
   NORMALISE
===================================================== */

function normaliseScore(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return "";

  }

  return Number(value);

}


/* =====================================================
   RESET
===================================================== */

function resetGameUI(){

  currentScores = {
    g1:"",
    g2:"",
    g3:""
  };


  for(
    let i=1;
    i<=3;
    i++
  ){

    const input =
      document.getElementById(
        "score" + i
      );

    const button =
      document.getElementById(
        "save" + i
      );

    const box =
      document.getElementById(
        "gameBox" + i
      );

    const status =
      document.getElementById(
        "status" + i
      );


    input.value = "";

    input.disabled = true;

    button.disabled = true;

    box.className =
      "game-box";

    status.className =
      "game-status locked";

    status.textContent =
      "🔐 Belum aktif";

  }


  document
    .getElementById(
      "totalValue"
    )
    .textContent =
      "0";


  document
    .getElementById(
      "scoreMessage"
    )
    .className =
      "message";

}


/* =====================================================
   RENDER GAMES
===================================================== */

function renderGames(){

  const scores =
    currentScores;


  const hasG1 =
    scores.g1 !== "" &&
    scores.g1 !== null &&
    scores.g1 !== undefined;


  const hasG2 =
    scores.g2 !== "" &&
    scores.g2 !== null &&
    scores.g2 !== undefined;


  const hasG3 =
    scores.g3 !== "" &&
    scores.g3 !== null &&
    scores.g3 !== undefined;


  /* VALUES */

  document
    .getElementById("score1")
    .value =
      hasG1
        ? scores.g1
        : "";

  document
    .getElementById("score2")
    .value =
      hasG2
        ? scores.g2
        : "";

  document
    .getElementById("score3")
    .value =
      hasG3
        ? scores.g3
        : "";


  /* GAME 1 */

  if(hasG1){

    setGameState(
      1,
      "saved",
      "🔒 Disimpan"
    );

  }else{

    setGameState(
      1,
      "active",
      "🎳 Aktif"
    );

  }


  /* GAME 2 */

  if(hasG2){

    setGameState(
      2,
      "saved",
      "🔒 Disimpan"
    );

  }else if(hasG1){

    setGameState(
      2,
      "active",
      "🎳 Aktif"
    );

  }else{

    setGameState(
      2,
      "locked",
      "🔐 Tunggu Game 1"
    );

  }


  /* GAME 3 */

  if(hasG3){

    setGameState(
      3,
      "saved",
      "🔒 Disimpan"
    );

  }else if(hasG2){

    setGameState(
      3,
      "active",
      "🎳 Aktif"
    );

  }else{

    setGameState(
      3,
      "locked",
      "🔐 Tunggu Game 2"
    );

  }


  /* TOTAL */

  const total =
    (hasG1 ? Number(scores.g1) : 0) +
    (hasG2 ? Number(scores.g2) : 0) +
    (hasG3 ? Number(scores.g3) : 0);


  document
    .getElementById(
      "totalValue"
    )
    .textContent =
      total;


  /* COMPLETE */

  if(
    hasG1 &&
    hasG2 &&
    hasG3
  ){

    showMessage(
      "scoreMessage",
      "✅ Semua 3 game untuk pemain ini telah selesai.",
      "success"
    );

  }

}


/* =====================================================
   GAME STATE
===================================================== */

function setGameState(
  gameNo,
  state,
  text
){

  const box =
    document.getElementById(
      "gameBox" + gameNo
    );

  const status =
    document.getElementById(
      "status" + gameNo
    );

  const input =
    document.getElementById(
      "score" + gameNo
    );

  const button =
    document.getElementById(
      "save" + gameNo
    );


  box.classList.remove(
    "active",
    "saved",
    "locked"
  );


  status.className =
    "game-status";


  if(state === "active"){

    box.classList.add(
      "active"
    );

    status.classList.add(
      "active"
    );

    input.disabled =
      false;

    button.disabled =
      false;

  }

  else if(state === "saved"){

    box.classList.add(
      "saved"
    );

    status.classList.add(
      "saved"
    );

    input.disabled =
      true;

    button.disabled =
      true;

  }

  else{

    box.classList.add(
      "locked"
    );

    status.classList.add(
      "locked"
    );

    input.disabled =
      true;

    button.disabled =
      true;

  }


  status.textContent =
    text;

}


/* =====================================================
   SAVE GAME
===================================================== */

async function saveGame(gameNo){

  if(!currentPlayer){

    showMessage(
      "scoreMessage",
      "Sila pilih pemain dahulu.",
      "error"
    );

    return;

  }


  const input =
    document.getElementById(
      "score" + gameNo
    );

  const button =
    document.getElementById(
      "save" + gameNo
    );


  const rawValue =
    input.value;


  /* 0 = SAH */

  if(
    rawValue === "" ||
    rawValue === null ||
    rawValue === undefined
  ){

    showMessage(
      "scoreMessage",
      "Sila masukkan score Game " +
        gameNo +
        ".",
      "error"
    );

    input.focus();

    return;

  }


  const score =
    Number(rawValue);


  if(
    isNaN(score) ||
    score < 0 ||
    score > 300
  ){

    showMessage(
      "scoreMessage",
      "Score mesti antara 0 hingga 300.",
      "error"
    );

    input.focus();

    return;

  }


  button.disabled =
    true;

  button.textContent =
    "⏳ MENYIMPAN...";


  try{

    const result =
      await jsonp(
        "api_teamleader_save_game",
        {
          token:token,
          nama:currentPlayer,
          game:gameNo,
          score:score
        }
      );


    if(
      !result ||
      !result.success
    ){

      throw new Error(
        result?.message ||
        "Gagal menyimpan score."
      );

    }


    /* UPDATE LOCAL */

    if(gameNo === 1){

      currentScores.g1 =
        score;

    }

    if(gameNo === 2){

      currentScores.g2 =
        score;

    }

    if(gameNo === 3){

      currentScores.g3 =
        score;

    }


    renderGames();


    showMessage(
      "scoreMessage",
      "✅ Game " +
        gameNo +
        " berjaya disimpan untuk " +
        currentPlayer +
        ".",
      "success"
    );


  }catch(error){

    showMessage(
      "scoreMessage",
      error.message ||
      "Gagal menyimpan score.",
      "error"
    );


    try{

      await loadSelectedPlayer();

    }catch(e){}

  }finally{

    button.textContent =
      "💾 SIMPAN G" +
      gameNo;

  }

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  elementId,
  text,
  type
){

  const element =
    document.getElementById(
      elementId
    );


  element.textContent =
    text;


  element.className =
    "message show " +
    (type || "");

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

  localStorage.removeItem(
    "teamLeaderToken"
  );


  token = "";

  currentTeam = "";

  currentLeader = "";

  players = [];

  currentPlayer = "";


  document
    .getElementById(
      "scoreSection"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "loginSection"
    )
    .classList
    .remove("hidden");


  document
    .getElementById(
      "username"
    )
    .value = "";


  document
    .getElementById(
      "password"
    )
    .value = "";


  document
    .getElementById(
      "playerSelect"
    )
    .innerHTML =
      '<option value="">-- Pilih Pemain --</option>';


  resetGameUI();

}
