<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RECRON • Team Showcase</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif;color:#fff}body{display:flex;align-items:flex-end;justify-content:center}.stage{width:100%;height:100%;padding:18px;display:flex;align-items:flex-end;justify-content:center}.panel{width:100%;max-width:720px;min-height:66%;border:1px solid rgba(255,255,255,.2);border-radius:28px;background:linear-gradient(160deg,rgba(10,12,18,.96),rgba(25,27,34,.94));box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px rgba(255,255,255,.12);overflow:hidden;position:relative}.glow{position:absolute;inset:auto -20% 70% -20%;height:180px;background:radial-gradient(circle,rgba(214,173,47,.2),transparent 65%);pointer-events:none}.head{padding:20px 22px 15px;position:relative}.brand{font-size:13px;font-weight:900;letter-spacing:4px;color:#d6ad2f}.event{font-size:12px;letter-spacing:1.5px;color:#aeb3bc;margin-top:5px}.show{display:flex;justify-content:space-between;align-items:flex-end;margin-top:18px}.eyebrow{font-size:10px;letter-spacing:2px;color:#9298a3;text-transform:uppercase}.team{font-size:34px;font-weight:950;line-height:1.05;margin-top:4px;letter-spacing:.3px}.rank{font-size:12px;color:#d6ad2f;font-weight:800;text-align:right}.rule{height:2px;background:linear-gradient(90deg,#d6ad2f,rgba(214,173,47,0));margin:0 22px}.players{padding:14px 16px 10px}.player{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:13px 8px;margin:6px 0;border:1px solid rgba(255,255,255,.08);border-radius:15px;background:rgba(255,255,255,.045)}.num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:12px;background:#242731;color:#d6ad2f}.name{font-size:14px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.section{font-size:9px;color:#858b96;margin-top:3px;letter-spacing:.3px}.score{text-align:right;font-size:20px;font-weight:950}.games{font-size:8px;color:#818793;margin-top:2px;white-space:nowrap}.summary{margin:4px 16px 0;padding:15px 16px;border-radius:17px;background:linear-gradient(90deg,rgba(214,173,47,.15),rgba(255,255,255,.045));border:1px solid rgba(214,173,47,.35);display:flex;justify-content:space-between;align-items:center}.summary small{font-size:9px;letter-spacing:1.7px;color:#a7acb5}.total{font-size:29px;font-weight:950;color:#fff}.footer{display:flex;justify-content:space-between;padding:12px 22px 17px;color:#707681;font-size:8px;letter-spacing:1px}.status{color:#d6ad2f}.empty{height:300px;display:grid;place-items:center;color:#a0a5ae;font-size:14px}.fade{animation:fade .45s ease}@keyframes fade{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-height:700px){.panel{min-height:78%}.team{font-size:27px}.player{padding:9px 8px}.head{padding-top:14px}.summary{padding:10px 14px}.total{font-size:24px}}
</style>
</head>
<body>
<div class="stage"><div class="panel" id="panel"><div class="glow"></div><div class="head"><div class="brand">RECRON</div><div class="event">INTERPLANT BOWLING TOURNAMENT 2026</div><div class="show"><div><div class="eyebrow">TEAM / GROUP SHOWCASE</div><div class="team" id="team">Loading...</div></div><div class="rank" id="rank">-- / --</div></div></div><div class="rule"></div><div class="players" id="players"><div class="empty">Memuatkan data...</div></div><div class="summary"><div><small>TEAM TOTAL</small></div><div class="total" id="total">0</div></div><div class="footer"><span class="status">● LIVE SCORE</span><span id="updated">--</span></div></div></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbwW8_FQ12mi6iQqfZaXbZ7C0qDm5_hR--lSDwYzWGixBu-APdxAxgImby7ZeVkwbRVO/exec?page=api_teamgroup';
let groups=[],current=0,timer=null,lastUpdated='--';
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function jsonp(){return new Promise((resolve,reject)=>{const cb='teamGroupCB_'+Date.now();const s=document.createElement('script');let done=false;window[cb]=d=>{done=true;cleanup();resolve(d)};s.src=API_URL+'&callback='+cb+'&_='+Date.now();s.onerror=()=>{if(!done){cleanup();reject(new Error('API error'))}};document.body.appendChild(s);function cleanup(){try{s.remove()}catch(e){}try{delete window[cb]}catch(e){window[cb]=undefined}};setTimeout(()=>{if(!done){cleanup();reject(new Error('Timeout'))}},10000)})}
function render(){if(!groups.length){document.getElementById('team').textContent='TIADA TEAM';document.getElementById('players').innerHTML='<div class="empty">Belum ada data team</div>';document.getElementById('total').textContent='0';return}const g=groups[current%groups.length];const p=document.getElementById('panel');p.classList.remove('fade');void p.offsetWidth;p.classList.add('fade');document.getElementById('team').textContent=g.team||'TEAM';document.getElementById('rank').textContent=(current%groups.length+1)+' / '+groups.length;document.getElementById('total').textContent=Number(g.total||0).toLocaleString('en-US');document.getElementById('updated').textContent='UPDATED '+lastUpdated;document.getElementById('players').innerHTML=(g.players||[]).slice(0,4).map((x,i)=>`<div class="player"><div class="num">${i+1}</div><div><div class="name">${esc(x.nama)}</div><div class="section">${esc(x.section||'')}</div></div><div><div class="score">${Number(x.total||0)}</div><div class="games">G1 ${Number(x.g1||0)} • G2 ${Number(x.g2||0)} • G3 ${Number(x.g3||0)}</div></div></div>`).join('')||'<div class="empty">Belum ada pemain</div>'}
async function load(){try{const r=await jsonp();if(r&&r.success){groups=Array.isArray(r.groups)?r.groups:[];lastUpdated=r.updated?String(r.updated).split(' ')[1]||String(r.updated):new Date().toLocaleTimeString('ms-MY');if(current>=groups.length)current=0;render();}else{throw new Error('Invalid data')}}catch(e){if(!groups.length)document.getElementById('players').innerHTML='<div class="empty">Menunggu sambungan live...</div>'}}
function next(){if(groups.length){current=(current+1)%groups.length;render()}}
function prev(){if(groups.length){current=(current-1+groups.length)%groups.length;render()}}
load();setInterval(load,5000);timer=setInterval(next,8000);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});
</script>
</body>
</html>
