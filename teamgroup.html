<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RECRON Bowling | Team Group Overlay</title>
<style>
:root{
  --gold:#f6c453;
  --gold2:#c99725;
  --white:#fff;
  --muted:#aab3c4;
  --panel:rgba(8,11,18,.96);
  --line:rgba(246,196,83,.28);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif;color:var(--white)}
body{display:flex;align-items:flex-end;justify-content:center}
.overlay{
  width:min(1180px,96vw);
  margin-bottom:28px;
  position:relative;
  border:1px solid var(--line);
  border-radius:26px;
  background:linear-gradient(145deg,rgba(8,11,18,.98),rgba(18,24,36,.96));
  box-shadow:0 22px 70px rgba(0,0,0,.45),0 0 35px rgba(246,196,83,.08);
  overflow:hidden;
}
.overlay:before{
  content:"";position:absolute;left:0;right:0;top:0;height:4px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.header{
  display:grid;grid-template-columns:145px 1fr auto;gap:22px;align-items:center;
  padding:24px 28px 18px;border-bottom:1px solid rgba(255,255,255,.08);
}
.logo{
  width:125px;height:105px;border-radius:18px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%);
}
.logo img{max-width:115px;max-height:100px;object-fit:contain}
.logoFallback{font-size:28px;font-weight:900;color:var(--gold);letter-spacing:2px}
.eyebrow{font-size:11px;color:var(--gold);font-weight:900;letter-spacing:2px;text-transform:uppercase}
.teamName{font-size:clamp(28px,4vw,48px);font-weight:950;letter-spacing:1px;text-transform:uppercase;margin-top:5px}
.subtitle{font-size:11px;color:var(--muted);letter-spacing:1.5px;margin-top:6px}
.rankBox{text-align:right;min-width:120px}
.rankLabel{font-size:10px;color:var(--muted);letter-spacing:1.5px}
.rank{font-size:48px;line-height:1;color:var(--gold);font-weight:950}
.rankTotal{font-size:11px;color:var(--muted);margin-top:5px}
.content{padding:18px 28px 22px}
.tableHead,.player{
  display:grid;grid-template-columns:42px minmax(250px,1fr) 78px 78px 78px 92px;
  align-items:center;gap:10px;
}
.tableHead{
  color:#788398;font-size:9px;font-weight:900;letter-spacing:1.5px;
  text-transform:uppercase;padding:0 14px 8px;
}
.player{
  min-height:55px;padding:8px 14px;border-top:1px solid rgba(255,255,255,.065);
  border-radius:10px;
}
.player.top1{background:linear-gradient(90deg,rgba(246,196,83,.14),transparent)}
.player.top2{background:linear-gradient(90deg,rgba(210,210,210,.08),transparent)}
.player.top3{background:linear-gradient(90deg,rgba(180,120,50,.08),transparent)}
.medal{font-size:18px;font-weight:900;text-align:center}
.playerName{font-size:14px;font-weight:900}
.section{display:block;color:#707b8e;font-size:9px;text-transform:uppercase;margin-top:3px;letter-spacing:.6px}
.scoreCell{text-align:center;font-size:14px;font-weight:800;color:#dce2ec}
.totalCell{text-align:right;color:var(--gold);font-size:18px;font-weight:950}
.bottom{
  display:flex;justify-content:space-between;align-items:center;gap:20px;
  padding:15px 28px;border-top:1px solid rgba(255,255,255,.08);
}
.totalLabel{font-size:10px;color:var(--muted);font-weight:900;letter-spacing:1.5px}
.teamTotal{font-size:32px;color:var(--gold);font-weight:950}
.live{font-size:10px;color:var(--gold);font-weight:900;letter-spacing:1.5px}
.liveDot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#f6c453;margin-right:6px;box-shadow:0 0 10px #f6c453}
.updated{font-size:9px;color:#697487;margin-top:4px;text-align:right}
.progress{height:3px;background:rgba(255,255,255,.07)}
.progress i{display:block;height:100%;background:var(--gold);width:0;animation:progress 8s linear}
@keyframes progress{from{width:0}to{width:100%}}
.fade{animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.empty{padding:35px;text-align:center;color:var(--muted)}
@media(max-width:800px){
  /* Mobile: keep player name on one line; scores sit directly underneath */
  .player-row{
    display:grid !important;
    grid-template-columns:56px minmax(0,1fr) !important;
    grid-template-rows:auto auto !important;
    column-gap:10px !important;
    row-gap:8px !important;
    align-items:center !important;
    min-width:0 !important;
  }

  .player-rank,.player-medal{
    grid-column:1 !important;
    grid-row:1 / span 2 !important;
  }

  .player-info{
    grid-column:2 !important;
    grid-row:1 !important;
    min-width:0 !important;
    overflow:hidden !important;
  }

  .player-name{
    white-space:nowrap !important;
    overflow:hidden !important;
    text-overflow:ellipsis !important;
    display:block !important;
    line-height:1.15 !important;
  }

  .player-section{
    white-space:nowrap !important;
    overflow:hidden !important;
    text-overflow:ellipsis !important;
    line-height:1.15 !important;
  }

  .player-scores{
    grid-column:2 !important;
    grid-row:2 !important;
    display:grid !important;
    grid-template-columns:repeat(4,minmax(0,1fr)) !important;
    gap:7px !important;
    width:100% !important;
    min-width:0 !important;
  }

  .score-box{
    min-width:0 !important;
    width:100% !important;
    padding:7px 4px !important;
    text-align:center !important;
    white-space:nowrap !important;
  }

  .score-label,.score-value{
    display:inline !important;
  }

  .score-label{margin-right:3px !important}

  .team-card,.player-card,.players{
    max-width:100% !important;
    overflow:hidden !important;
  }
}
</style>
</head>
<body>
<div class="overlay" id="overlay">
  <div class="header">
    <div class="logo" id="logo"></div>
    <div>
      <div class="eyebrow">RECRON BOWLING TOURNAMENT 2026</div>
      <div class="teamName" id="teamName">LOADING...</div>
      <div class="subtitle">LIVE TEAM SCOREBOARD • TOP 3 PLAYER HIGHLIGHT</div>
    </div>
    <div class="rankBox">
      <div class="rankLabel">TEAM RANK</div>
      <div class="rank" id="rank">—</div>
      <div class="rankTotal" id="rankTotal">— / —</div>
    </div>
  </div>

  <div class="content">
    <div class="tableHead">
      <div>#</div><div>PLAYER</div><div>GAME 1</div><div>GAME 2</div><div>GAME 3</div><div style="text-align:right">TOTAL</div>
    </div>
    <div id="players"><div class="empty">Loading live score...</div></div>
  </div>

  <div class="bottom">
    <div>
      <div class="totalLabel">TEAM TOTAL</div>
      <div class="teamTotal" id="teamTotal">0</div>
    </div>
    <div>
      <div class="live"><span class="liveDot"></span>LIVE SCORE</div>
      <div class="updated" id="updated">—</div>
    </div>
  </div>
  <div class="progress"><i id="progress"></i></div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwW8_FQ12mi6iQqfZaXbZ7C0qDm5_hR--lSDwYzWGixBu-APdxAxgImby7ZeVkwbRVO/exec?page=api_teamgroup&callback=teamOverlayCallback";
const REFRESH_MS = 5000;
const SLIDE_MS = 8000;

let groups = [];
let currentIndex = 0;
let slideTimer = null;

function esc(v){
  return String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function logoUrl(url){
  if(!url) return "";
  const s=String(url);
  let m=s.match(/\/d\/([A-Za-z0-9_-]+)/);
  if(m) return "https://drive.google.com/thumbnail?id="+m[1]+"&sz=w1000";
  m=s.match(/[?&]id=([A-Za-z0-9_-]+)/);
  if(m) return "https://drive.google.com/thumbnail?id="+m[1]+"&sz=w1000";
  return s;
}
function initials(name){
  return String(name||"?").split(/\s+/).filter(Boolean).slice(0,2)
    .map(x=>x.charAt(0)).join("").toUpperCase();
}
function score(v){ return Number(v||0) || 0; }

function render(group){
  if(!group) return;
  const pos = groups.indexOf(group)+1;

  document.getElementById("teamName").textContent = group.team || "UNNAMED TEAM";
  document.getElementById("rank").textContent = pos;
  document.getElementById("rankTotal").textContent = pos+" / "+groups.length;
  document.getElementById("teamTotal").textContent = score(group.total);
  document.getElementById("updated").textContent = "Updated "+(window.__dataUpdated || "—");

  const logo=document.getElementById("logo");
  const src=logoUrl(group.logo);
  logo.innerHTML=src
    ? '<img src="'+esc(src)+'" alt="'+esc(group.team)+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'"><div class="logoFallback" style="display:none">'+esc(initials(group.team))+'</div>'
    : '<div class="logoFallback">'+esc(initials(group.team))+'</div>';

  const players=(group.players||[]).slice().sort((a,b)=>score(b.total)-score(a.total)||String(a.nama).localeCompare(String(b.nama)));
  const medals=["🥇","🥈","🥉"];

  document.getElementById("players").innerHTML=players.map((p,i)=>{
    const cls=i<3 ? " top"+(i+1) : "";
    const medal=i<3 ? medals[i] : (i+1);
    return '<div class="player'+cls+'">'+
      '<div class="medal">'+medal+'</div>'+
      '<div><div class="playerName">'+esc(p.nama)+'</div>'+
      (p.section?'<span class="section">'+esc(p.section)+'</span>':'')+
      '</div>'+
      '<div class="scoreCell">'+score(p.g1)+'</div>'+
      '<div class="scoreCell">'+score(p.g2)+'</div>'+
      '<div class="scoreCell">'+score(p.g3)+'</div>'+
      '<div class="totalCell">'+score(p.total)+'</div>'+
      '</div>';
  }).join("") || '<div class="empty">Belum ada pemain.</div>';

  const overlay=document.getElementById("overlay");
  overlay.classList.remove("fade"); void overlay.offsetWidth; overlay.classList.add("fade");

  const bar=document.getElementById("progress");
  bar.style.animation="none"; void bar.offsetWidth; bar.style.animation="progress "+(SLIDE_MS/1000)+"s linear";
}

function teamOverlayCallback(data){
  if(!data || !data.success) return;
  groups=Array.isArray(data.groups)?data.groups:[];
  window.__dataUpdated=data.updated||"—";
  if(!groups.length){
    document.getElementById("teamName").textContent="NO TEAM DATA";
    document.getElementById("players").innerHTML='<div class="empty">Tiada data team.</div>';
    return;
  }
  if(currentIndex>=groups.length) currentIndex=0;
  render(groups[currentIndex]);
}

function load(){
  const old=document.getElementById("apiScript");
  if(old) old.remove();
  const script=document.createElement("script");
  script.id="apiScript";
  script.src=API_URL+"&_="+Date.now();
  script.onerror=()=>{};
  document.body.appendChild(script);
}

function startSlide(){
  clearInterval(slideTimer);
  slideTimer=setInterval(()=>{
    if(groups.length>1){
      currentIndex=(currentIndex+1)%groups.length;
      render(groups[currentIndex]);
    }
  },SLIDE_MS);
}

load();
setInterval(load,REFRESH_MS);
startSlide();
</script>
</body>
</html>
