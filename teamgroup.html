<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RECRON • Live Team</title>
<style>
:root{--bg:#070a10;--panel:#111722;--gold:#f6c453;--text:#f5f7fb;--muted:#9aa5b5;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#0b0f17,#05070b);color:var(--text)}
body{padding:12px}.wrap{width:min(1120px,100%);margin:auto}.panel{border:1px solid rgba(246,196,83,.45);border-radius:24px;overflow:hidden;background:linear-gradient(145deg,#151c28,#0c121b);box-shadow:0 25px 70px rgba(0,0,0,.45)}
.header{position:relative;display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:20px;align-items:center;padding:25px;border-bottom:1px solid var(--line)}.home{position:absolute;right:18px;top:15px;padding:8px 12px;border:1px solid rgba(246,196,83,.5);border-radius:999px;background:rgba(246,196,83,.07);color:#ffdf72;text-decoration:none;font-size:9px;font-weight:900;letter-spacing:1px}.logo{width:100px;height:90px;border-radius:16px;background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center}.logo img{max-width:92px;max-height:84px;object-fit:contain}.fallback{color:var(--gold);font-size:24px;font-weight:950}.eyebrow{color:var(--gold);font-size:9px;font-weight:900;letter-spacing:2px;margin-top:16px}.team{font-size:clamp(28px,5vw,50px);font-weight:950;text-transform:uppercase;line-height:1;overflow-wrap:anywhere;margin-top:6px}.sub{color:var(--muted);font-size:10px;letter-spacing:1.2px;margin-top:8px}.rankSummary{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.summaryItem{min-width:0}.summaryItem.right{text-align:right}.ranklabel{font-size:9px;color:var(--muted);letter-spacing:1.5px}.rank{font-size:45px;color:var(--gold);font-weight:950;line-height:1}.ranktotal{font-size:9px;color:var(--muted);margin-top:4px}.teamtotal{font-size:45px;color:var(--gold);font-weight:950;line-height:1}
.content{padding:18px 20px}.thead,.player{display:grid;grid-template-columns:44px minmax(0,1fr) 75px 75px 75px 85px;gap:8px;align-items:center}.thead{padding:0 12px 8px;color:#788398;font-size:8px;font-weight:900;letter-spacing:1.4px}.player{padding:11px 12px;margin:6px 0;border:1px solid rgba(255,255,255,.055);border-radius:13px;background:rgba(255,255,255,.025)}.player-info{min-width:0}..player:nth-child(1){background:linear-gradient(90deg,rgba(246,196,83,.14),rgba(255,255,255,.02))}.player:nth-child(2){background:linear-gradient(90deg,rgba(210,210,210,.08),rgba(255,255,255,.02))}.player:nth-child(3){background:linear-gradient(90deg,rgba(180,120,50,.08),rgba(255,255,255,.02))}.medal{text-align:center;font-size:17px;font-weight:950}.name{font-size:13px;font-weight:900;overflow-wrap:anywhere}.section{margin-top:3px;color:#778397;font-size:8px}.score{text-align:center;font-size:13px;font-weight:800}.total{text-align:right;color:var(--gold);font-size:17px;font-weight:950}.bottom{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-top:1px solid var(--line)}.label{font-size:8px;color:var(--muted);letter-spacing:1.5px}.teamtotal{font-size:31px;color:var(--gold);font-weight:950}.live{color:var(--gold);font-size:9px;font-weight:900;letter-spacing:1.2px;text-align:right}.updated{color:#6f7a8c;font-size:8px;margin-top:4px;text-align:right}.progress{height:3px;background:rgba(255,255,255,.06)}.progress i{display:block;height:100%;background:var(--gold);width:0}
.empty{text-align:center;padding:45px;color:var(--muted)}
@media(max-width:700px){
 body{padding:7px}.panel{border-radius:20px}.header{grid-template-columns:68px minmax(0,1fr);gap:10px;padding:62px 13px 15px}.home{top:11px;right:11px}.logo{width:68px;height:68px}.logo img{max-width:63px;max-height:63px}.eyebrow{font-size:7px;letter-spacing:1.2px}.team{font-size:clamp(25px,9vw,38px)}.sub{font-size:8px}.rankSummary{gap:10px;margin-top:12px;padding-top:10px}.rank{font-size:30px}.teamtotal{font-size:30px}.summaryItem.right{text-align:right}.content{padding:10px}.thead{display:none}.player{grid-template-columns:30px minmax(0,1fr);gap:8px;padding:10px 8px}.player-info{grid-column:2}.score,.total{grid-column:2}.score.g1{margin-top:7px}.score.g2,.score.g3,.total{margin-top:0}.score,.total{background:rgba(255,255,255,.045);border-radius:7px;padding:5px 2px;text-align:center;font-size:11px}.player{grid-template-columns:30px minmax(0,1fr) repeat(4,1fr)}.player-info{grid-column:2 / 6}.score.g1{grid-column:2}.score.g2{grid-column:3}.score.g3{grid-column:4}.total{grid-column:5}.score:before{display:block;color:#778397;font-size:6px;margin-bottom:2px}.score.g1:before{content:"G1"}.score.g2:before{content:"G2"}.score.g3:before{content:"G3"}.total:before{content:"TOT";display:block;color:#778397;font-size:6px;margin-bottom:2px}.bottom{padding:12px}.live{font-size:8px}}
</style>
</head>
<body><main class="wrap"><section class="panel">
<header class="header"><a class="home" href="./">⌂ HOME</a><div class="logo" id="logo"></div><div><div class="eyebrow">RECRON BOWLING TOURNAMENT 2026</div><div class="team" id="team">LOADING...</div><div class="sub">LIVE TEAM SCOREBOARD • TOP 3 PLAYER HIGHLIGHT</div></div><div class="rankSummary">
  <div class="summaryItem">
    <div class="ranklabel">TEAM RANK</div>
    <div class="rank" id="rank">—</div>
    <div class="ranktotal" id="ranktotal">— / —</div>
  </div>
  <div class="summaryItem right">
    <div class="ranklabel">TEAM TOTAL</div>
    <div class="teamtotal" id="teamtotal">0</div>
    <div class="ranktotal">LIVE TOTAL</div>
  </div>
</div></header>
<div class="content"><div class="thead"><div>#</div><div>PLAYER</div><div>GAME 1</div><div>GAME 2</div><div>GAME 3</div><div style="text-align:right">TOTAL</div></div><div id="players"><div class="empty">Loading live score...</div></div></div>
<div class="bottom"><div></div><div><div class="live">● LIVE SCORE</div><div class="updated" id="updated">—</div></div></div><div class="progress"><i id="progress"></i></div>
</section></main>
<script>
const API="https://script.google.com/macros/s/AKfycbwW8_FQ12mi6iQqfZaXbZ7C0qDm5_hR--lSDwYzWGixBu-APdxAxgImby7ZeVkwbRVO/exec";let groups=[],idx=0,slide=null;
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const logo=v=>{if(!v)return"";let s=String(v),m=s.match(/\/d\/([A-Za-z0-9_-]+)/)||s.match(/[?&]id=([A-Za-z0-9_-]+)/);return m?"https://drive.google.com/thumbnail?id="+m[1]+"&sz=w1000":s};
const initials=s=>String(s||"?").split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();
function render(g){
 if(!g)return;document.getElementById("team").textContent=g.team||"UNNAMED TEAM";document.getElementById("rank").textContent=idx+1;document.getElementById("ranktotal").textContent=(idx+1)+" / "+groups.length;document.getElementById("teamtotal").textContent=Number(g.total||0);document.getElementById("updated").textContent="Updated "+(window.updated||"—");
 const l=logo(g.logo),lg=document.getElementById("logo");lg.innerHTML=l?`<img src="${esc(l)}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="fallback" style="display:none">${esc(initials(g.team))}</div>`:`<div class="fallback">${esc(initials(g.team))}</div>`;
 const ps=(g.players||[]).slice().sort((a,b)=>Number(b.total||0)-Number(a.total||0)||String(a.nama).localeCompare(String(b.nama)));
 document.getElementById("players").innerHTML=ps.map((p,i)=>{let medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1;return `<div class="player"><div class="medal">${medal}</div><div class="player-info"><div class="name">${esc(p.nama)}</div>${p.section?`<div class="section">${esc(p.section)}</div>`:""}</div><div class="score g1">${Number(p.g1||0)}</div><div class="score g2">${Number(p.g2||0)}</div><div class="score g3">${Number(p.g3||0)}</div><div class="total">${Number(p.total||0)}</div></div>`}).join("")||'<div class="empty">Belum ada pemain.</div>';
 const bar=document.getElementById("progress");bar.style.width="0";setTimeout(()=>bar.style.width="100%",20);bar.style.transition="width 8s linear";
}
function callback(d){if(!d||!d.success)return;groups=d.groups||[];window.updated=d.updated||"—";if(!groups.length){document.getElementById("team").textContent="NO TEAM DATA";return}if(idx>=groups.length)idx=0;render(groups[idx])}
function load(){const old=document.getElementById("api");if(old)old.remove();const s=document.createElement("script");s.id="api";s.src=API+"?page=api_teamgroup&callback=callback&t="+Date.now();s.onerror=()=>{};document.body.appendChild(s)}
function start(){clearInterval(slide);slide=setInterval(()=>{if(groups.length>1){idx=(idx+1)%groups.length;render(groups[idx])}},8000)}
load();setInterval(load,5000);start();
</script></body></html>
