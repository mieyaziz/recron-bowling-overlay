<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RECRON • Tournament Rules</title><style>
:root{--bg:#080b12;--panel:#111722;--gold:#f6c744;--gold2:#ffdf72;--text:#f5f7fb;--muted:#9aa5b5;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 50% -10%,rgba(246,199,68,.13),transparent 34%),linear-gradient(180deg,#0b0f17,#070a10);color:var(--text)}
body{padding:10px 8px 28px}.wrap{width:min(1040px,100%);margin:auto}.panel{position:relative;overflow:hidden;border:1px solid rgba(246,199,68,.42);border-radius:24px;background:linear-gradient(135deg,rgba(255,255,255,.035),transparent 45%),linear-gradient(180deg,#131a26,#0d131d);box-shadow:0 24px 70px rgba(0,0,0,.45)}
.home{position:absolute;right:18px;top:16px;z-index:3;padding:9px 14px;border:1px solid rgba(246,199,68,.45);border-radius:999px;background:rgba(246,199,68,.07);color:var(--gold2);text-decoration:none;font-size:11px;font-weight:900;letter-spacing:1px}.header{padding:34px 24px 22px;border-bottom:1px solid var(--line)}.eyebrow{color:var(--gold);font-size:11px;font-weight:900;letter-spacing:2.5px;text-transform:uppercase}h1{margin:8px 0 0;font-size:clamp(32px,6vw,56px);line-height:1}.sub{margin:11px 0 0;color:#c0c8d4;font-size:13px;letter-spacing:.6px}.status{margin-top:10px;color:var(--muted);font-size:10px}.card{border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.015))}footer{padding:18px 24px;border-top:1px solid var(--line);color:#758093;font-size:9px;letter-spacing:1.2px;text-transform:uppercase}
@media(max-width:680px){.header{padding:30px 18px 20px}.home{right:13px;top:13px}.sub{font-size:11px}}

.rules{display:grid;gap:12px;padding:20px}.category{padding:13px 15px;border-left:4px solid var(--gold);border-radius:12px;background:rgba(246,199,68,.07);color:var(--gold);font-size:11px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase}.rule{display:grid;grid-template-columns:42px 1fr;gap:13px;padding:17px}.num{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:var(--gold);color:#111;font-weight:900}.title{font-size:15px;font-weight:900;margin-bottom:6px}.content{color:#aeb8c7;font-size:12px;line-height:1.7;white-space:pre-line}
</style></head><body><main class="wrap"><section class="panel"><a class="home" href="./">⌂ HOME</a><header class="header"><div class="eyebrow">OFFICIAL INFORMATION</div><h1>TOURNAMENT RULES</h1><div class="sub">Sila baca dan fahami semua peraturan pertandingan.</div><div id="status" class="status">Loading rules...</div></header><section id="rules" class="rules"></section><footer>RECRON BOWLING TOURNAMENT 2026</footer></section></main><script>
const API="https://script.google.com/macros/s/AKfycbwW8_FQ12mi6iQqfZaXbZ7C0qDm5_hR--lSDwYzWGixBu-APdxAxgImby7ZeVkwbRVO/exec?page=api_rules&callback=rulesCallback";
function esc(v){const d=document.createElement("div");d.textContent=v==null?"":String(v);return d.innerHTML}
function rulesCallback(rows){let n=0,html="";(rows||[]).forEach(r=>{let t=String(r.title||"").trim(),c=String(r.content||"").trim();if(!t&&!c)return;if(t&&!c){html+=`<div class="category">${esc(t)}</div>`;return}n++;html+=`<article class="card rule"><div class="num">${n}</div><div><div class="title">${esc(t||"Peraturan "+n)}</div><div class="content">${esc(c)}</div></div></article>`});document.getElementById("rules").innerHTML=html||'<div class="card rule"><div class="content">Tiada peraturan dijumpai.</div></div>';document.getElementById("status").textContent=n+" peraturan dimuatkan"}
function load(){const s=document.createElement("script");s.src=API;s.onerror=()=>document.getElementById("status").textContent="Unable to load rules";document.body.appendChild(s)}load();
</script></body></html>
