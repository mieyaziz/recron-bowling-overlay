<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RECRON LIVE OVERLAY</title>

  <style>
    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      padding:0;
      width:100%;
      min-height:100%;
      background:#05070b;
      color:#fff;
      font-family:Arial,Helvetica,sans-serif;
      overflow-x:hidden;
    }

    body{
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }

    /* =========================================================
       MAIN OVERLAY
       ========================================================= */

    .overlay{
      width:100%;
      max-width:1080px;
      min-height:100vh;
      padding:24px;
      background:
        radial-gradient(
          circle at 90% 0%,
          rgba(0,100,220,.20),
          transparent 35%
        ),
        linear-gradient(
          160deg,
          #06080c,
          #101722 50%,
          #050505
        );
    }


    /* =========================================================
       HEADER
       ========================================================= */

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;

      border-bottom:2px solid #168dff;

      padding-bottom:16px;
      margin-bottom:20px;
    }

    .brand{
      min-width:0;
      flex:1;

      display:flex;
      align-items:center;
      gap:14px;
    }

    .logo{
      width:68px;
      height:68px;

      object-fit:contain;
      flex-shrink:0;
    }

    .event-title{
      font-size:clamp(18px,3vw,29px);
      font-weight:900;
      line-height:1.1;
    }

    .live-badge{
      display:inline-flex;
      align-items:center;
      gap:7px;

      background:#e00000;

      padding:6px 12px;
      margin-top:7px;

      border-radius:20px;

      font-size:11px;
      font-weight:900;
    }

    .live-dot{
      width:9px;
      height:9px;

      border-radius:50%;

      background:#fff;

      animation:blink 1s infinite;
    }

    @keyframes blink{
      50%{
        opacity:.25;
      }
    }

    .clock{
      text-align:right;

      color:#aaa;

      font-size:10px;

      flex-shrink:0;
    }

    .clock strong{
      display:block;

      color:#fff;

      font-size:16px;

      margin-bottom:3px;
    }


    /* =========================================================
       RANKING GRID
       ========================================================= */

    .ranking-grid{
      display:grid;

      grid-template-columns:
        1fr
        1fr;

      gap:16px;

      margin-bottom:16px;
    }


    /* =========================================================
       PANEL
       ========================================================= */

    .panel{
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.065),
          rgba(255,255,255,.025)
        );

      border:1px solid rgba(255,255,255,.10);

      border-radius:16px;

      padding:16px;

      overflow:hidden;
    }

    .section-title{
      display:flex;
      align-items:center;
      gap:9px;

      margin:0 0 10px;

      font-size:17px;
      font-weight:900;
    }

    .section-title span{
      width:5px;
      height:19px;

      display:inline-block;

      background:#168dff;

      border-radius:4px;
    }


    /* =========================================================
       RANKING ROW
       ========================================================= */

    .ranking-row{
      display:grid;

      grid-template-columns:
        36px
        minmax(0,1fr)
        auto;

      align-items:center;

      gap:9px;

      padding:9px 0;

      border-bottom:
        1px solid
        rgba(255,255,255,.07);
    }

    .ranking-row:last-child{
      border-bottom:0;
    }


    /* =========================================================
       RANK NUMBER
       ========================================================= */

    .rank{
      width:29px;
      height:29px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:50%;

      background:#222;

      font-size:12px;
      font-weight:900;
    }

    .rank.gold{
      background:#c99b22;
      color:#000;
    }

    .rank.silver{
      background:#999;
      color:#000;
    }

    .rank.bronze{
      background:#a56a3d;
      color:#fff;
    }


    /* =========================================================
       PLAYER
       ========================================================= */

    .player-name{
      font-size:15px;
      font-weight:900;

      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .player-team{
      margin-top:3px;

      color:#999;

      font-size:9px;

      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .score{
      color:#5bb4ff;

      font-size:19px;
      font-weight:900;

      white-space:nowrap;
    }


    /* =========================================================
       TEAM RANKING
       ========================================================= */

    .team-panel{
      width:100%;

      margin-bottom:0;
    }

    .team-row{
      display:grid;

      grid-template-columns:
        40px
        minmax(0,1fr)
        auto;

      align-items:center;

      gap:10px;

      padding:10px 0;

      border-bottom:
        1px solid
        rgba(255,255,255,.07);
    }

    .team-row:last-child{
      border-bottom:0;
    }

    .team-name{
      font-size:16px;
      font-weight:900;

      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .team-members{
      color:#999;

      font-size:9px;

      margin-top:3px;
    }

    .team-score{
      color:#fff;

      font-size:21px;
      font-weight:900;

      white-space:nowrap;
    }


    /* =========================================================
       EMPTY / LOADING
       ========================================================= */

    .empty{
      color:#777;

      text-align:center;

      padding:20px 10px;

      font-size:11px;
    }

    .loading{
      color:#8ea2b8;

      text-align:center;

      padding:20px;

      font-size:11px;
    }


    /* =========================================================
       FOOTER
       ========================================================= */

    .footer{
      display:flex;

      justify-content:space-between;

      gap:10px;

      margin-top:15px;

      color:#667080;

      font-size:8px;
      font-weight:700;

      text-transform:uppercase;
    }


    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media(max-width:700px){

      .overlay{
        padding:14px;
      }

      .ranking-grid{
        grid-template-columns:1fr;
        gap:12px;
      }

      .logo{
        width:50px;
        height:50px;
      }

      .event-title{
        font-size:18px;
      }

      .clock{
        font-size:8px;
      }

      .clock strong{
        font-size:13px;
      }

      .section-title{
        font-size:16px;
      }

      .player-name{
        font-size:14px;
      }

      .score{
        font-size:18px;
      }

      .team-name{
        font-size:14px;
      }

      .team-score{
        font-size:19px;
      }

    }


    @media(max-width:420px){

      .overlay{
        padding:10px;
      }

      .topbar{
        padding-bottom:12px;
        margin-bottom:12px;
      }

      .brand{
        gap:9px;
      }

      .logo{
        width:42px;
        height:42px;
      }

      .event-title{
        font-size:15px;
      }

      .live-badge{
        padding:4px 8px;
        font-size:9px;
      }

      .panel{
        padding:12px;
        border-radius:13px;
      }

      .ranking-row{
        grid-template-columns:
          32px
          minmax(0,1fr)
          auto;

        padding:7px 0;
      }

      .rank{
        width:26px;
        height:26px;

        font-size:10px;
      }

      .player-name{
        font-size:12px;
      }

      .player-team{
        font-size:8px;
      }

      .score{
        font-size:16px;
      }

      .team-row{
        grid-template-columns:
          32px
          minmax(0,1fr)
          auto;

        padding:8px 0;
      }

      .team-name{
        font-size:13px;
      }

      .team-score{
        font-size:17px;
      }

    }

  </style>
</head>


<body>

<div class="overlay">


  <!-- =========================================================
       HEADER
       ========================================================= -->

  <div class="topbar">

    <div class="brand">

      <!-- Logo -->
      <img
        class="logo"
        src="https://raw.githubusercontent.com/mieyaziz/recron-bowling-overlay/main/recron-logo.png"
        alt="RECRON"
        onerror="this.style.display='none'"
      >

      <div>

        <div class="event-title">
          RECRON BOWLING TOURNAMENT 2026
        </div>

        <div class="live-badge">

          <span class="live-dot"></span>

          LIVE

        </div>

      </div>

    </div>


    <div class="clock">

      <strong id="clock">
        --:--:--
      </strong>

      <span id="updated">
        Connecting...
      </span>

    </div>

  </div>



  <!-- =========================================================
       TOP 5 MEN + TOP 5 WOMEN
       ========================================================= -->

  <div class="ranking-grid">


    <!-- =======================================================
         TOP 5 MEN
         ======================================================= -->

    <div class="panel">

      <div class="section-title">

        <span></span>

        TOP 5 LELAKI

      </div>

      <div id="individualMale">

        <div class="loading">
          Memuatkan ranking...
        </div>

      </div>

    </div>



    <!-- =======================================================
         TOP 5 WOMEN
         ======================================================= -->

    <div class="panel">

      <div class="section-title">

        <span></span>

        TOP 5 PEREMPUAN

      </div>

      <div id="individualFemale">

        <div class="loading">
          Memuatkan ranking...
        </div>

      </div>

    </div>

  </div>



  <!-- =========================================================
       TOP 5 TEAM
       ========================================================= -->

  <div class="panel team-panel">

    <div class="section-title">

      <span></span>

      TOP 5 TEAM RANKING

    </div>

    <div id="teamRanking">

      <div class="loading">
        Memuatkan ranking...
      </div>

    </div>

  </div>



  <!-- =========================================================
       FOOTER
       ========================================================= -->

  <div class="footer">

    <span>
      RECRON BOWLING TOURNAMENT 2026
    </span>

    <span>
      LIVE OVERLAY
    </span>

  </div>

</div>



<script>

/* =============================================================
   CONFIG
   ============================================================= */

const API =
  "https://script.google.com/macros/s/AKfycbwW8_FQ12mi6iQqfZaXbZ7C0qDm5_hR--lSDwYzWGixBu-APdxAxgImby7ZeVkwbRVO/exec";


/* =============================================================
   JSONP
   ============================================================= */

function jsonp(page, params = {}) {

  return new Promise((resolve, reject) => {

    const callbackName =
      "cb_" +
      Date.now() +
      "_" +
      Math.floor(
        Math.random() * 100000
      );


    const script =
      document.createElement("script");


    const query =
      new URLSearchParams({

        page: page,

        callback: callbackName,

        ...params

      });


    const timer =
      setTimeout(() => {

        cleanup();

        reject(
          new Error(
            "API timeout"
          )
        );

      }, 15000);


    function cleanup() {

      clearTimeout(timer);

      delete window[callbackName];

      script.remove();

    }


    window[callbackName] =
      data => {

        cleanup();

        resolve(data);

      };


    script.onerror =
      () => {

        cleanup();

        reject(
          new Error(
            "Gagal sambung ke API."
          )
        );

      };


    script.src =
      API +
      "?" +
      query.toString();


    document.body.appendChild(script);

  });

}


/* =============================================================
   ESCAPE HTML
   ============================================================= */

function esc(value) {

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =============================================================
   RANK CLASS
   ============================================================= */

function rankClass(rank) {

  rank =
    Number(rank) || 0;


  if(rank === 1)
    return "gold";


  if(rank === 2)
    return "silver";


  if(rank === 3)
    return "bronze";


  return "";

}


/* =============================================================
   RENDER INDIVIDUAL
   ============================================================= */

function renderIndividuals(
  players,
  elementId
) {

  const element =
    document.getElementById(
      elementId
    );


  if(
    !Array.isArray(players) ||
    !players.length
  ){

    element.innerHTML =
      '<div class="empty">' +
      'Tiada skor direkodkan' +
      '</div>';

    return;

  }


  /*
    Pastikan hanya TOP 5.
  */

  const top5 =
    players
      .slice(0,5);


  element.innerHTML =
    top5
      .map(
        (player,index) => {

          const rank =
            Number(
              player.rank
            ) ||
            index + 1;


          return `

            <div class="ranking-row">

              <div class="rank ${rankClass(rank)}">
                ${rank}
              </div>


              <div>

                <div class="player-name">
                  ${esc(player.nama)}
                </div>

                <div class="player-team">
                  ${esc(player.team || "-")}
                </div>

              </div>


              <div class="score">
                ${Number(player.total || 0)}
              </div>

            </div>

          `;

        }
      )
      .join("");

}


/* =============================================================
   RENDER TEAM
   ============================================================= */

function renderTeams(
  teams
) {

  const element =
    document.getElementById(
      "teamRanking"
    );


  if(
    !Array.isArray(teams) ||
    !teams.length
  ){

    element.innerHTML =
      '<div class="empty">' +
      'Tiada ranking team' +
      '</div>';

    return;

  }


  /*
    Pastikan hanya TOP 5.
  */

  const top5 =
    teams
      .slice(0,5);


  element.innerHTML =
    top5
      .map(
        (team,index) => {

          const rank =
            Number(
              team.rank
            ) ||
            index + 1;


          return `

            <div class="team-row">

              <div class="rank ${rankClass(rank)}">
                ${rank}
              </div>


              <div>

                <div class="team-name">
                  ${esc(team.team)}
                </div>

                <div class="team-members">
                  ${Number(team.players || 0)}
                  pemain
                </div>

              </div>


              <div class="team-score">
                ${Number(team.total || 0)}
              </div>

            </div>

          `;

        }
      )
      .join("");

}


/* =============================================================
   LOAD OVERLAY DATA
   ============================================================= */

function loadOverlay() {

  jsonp(
    "api_liveoverlay"
  )

  .then(
    data => {

      if(
        !data ||
        data.success !== true
      ){

        throw new Error(
          "Data overlay tidak sah."
        );

      }


      /*
        TOP 5 LELAKI
      */

      renderIndividuals(
        data.individualMale || [],
        "individualMale"
      );


      /*
        TOP 5 PEREMPUAN
      */

      renderIndividuals(
        data.individualFemale || [],
        "individualFemale"
      );


      /*
        TOP 5 TEAM
      */

      renderTeams(
        data.teamRanking || []
      );


      /*
        Last update
      */

      document
        .getElementById(
          "updated"
        )
        .textContent =
          "Update: " +
          (
            data.updated ||
            "-"
          );

    }
  )

  .catch(
    error => {

      console.error(
        error
      );


      document
        .getElementById(
          "updated"
        )
        .textContent =
          "Connection error";

    }
  );

}


/* =============================================================
   CLOCK
   ============================================================= */

function updateClock() {

  document
    .getElementById(
      "clock"
    )
    .textContent =
      new Date()
        .toLocaleTimeString(
          "en-GB"
        );

}


/* =============================================================
   START
   ============================================================= */

updateClock();

setInterval(
  updateClock,
  1000
);


/*
  Load pertama
*/

loadOverlay();


/*
  Refresh setiap 5 saat
*/

setInterval(
  loadOverlay,
  5000
);

</script>

</body>
</html>
