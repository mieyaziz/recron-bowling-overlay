<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RECRON • Countdown</title>
<style>
:root{--bg:#070a10;--panel:#111722;--gold:#f6c744;--gold2:#ffdf72;--text:#f5f7fb;--muted:#9aa5b5;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#0b0f17,#05070b);color:var(--text)}
body{padding:14px}.wrap{width:min(1050px,100%);margin:auto}.panel{position:relative;overflow:hidden;border:1px solid rgba(246,199,68,.45);border-radius:26px;background:linear-gradient(145deg,#151c28,#0c121b);box-shadow:0 25px 70px rgba(0,0,0,.45)}
.panel:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 80% 0,rgba(246,199,68,.12),transparent 30%)}
.home{position:absolute;right:20px;top:18px;z-index:5;padding:10px 15px;border:1px solid rgba(246,199,68,.5);border-radius:999px;background:rgba(246,199,68,.07);color:var(--gold2);text-decoration:none;font-size:11px;font-weight:900;letter-spacing:1px}
.header{position:relative;padding:42px 28px 24px;border-bottom:1px solid var(--line)}.eyebrow{color:var(--gold);font-size:11px;font-weight:900;letter-spacing:2.5px}h1{margin:9px 0 0;font-size:clamp(34px,7vw,64px);line-height:.98;max-width:760px}.sub{margin-top:12px;color:#c0c8d4;font-size:13px;letter-spacing:.8px}
.content{padding:28px}.status{text-align:center;color:var(--muted);font-size:12px;min-height:18px}.date{font-size:15px;text-align:center;color:#d7dde6;margin-top:8px}.venue{text-align:center;color:var(--gold);font-weight:900;font-size:12px;letter-spacing:1px;margin-top:7px}
.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:820px;margin:28px auto}.box{padding:25px 10px;text-align:center;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.035)}.num{font-size:clamp(36px,6vw,58px);font-weight:950;color:var(--gold)}.label{margin-top:7px;color:#aab4c2;font-size:10px;letter-spacing:1.8px}.done{text-align:center;color:var(--gold);font-weight:950;font-size:25px;margin:32px 0}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:25px}.btn{padding:13px 21px;border-radius:999px;text-decoration:none;font-size:11px;font-weight:900;letter-spacing:.8px;border:1px solid rgba(246,199,68,.45)}.primary{background:var(--gold);color:#111}.secondary{background:rgba(255,255,255,.04);color:#fff}
footer{padding:17px 24px;border-top:1px solid var(--line);color:#758093;font-size:9px;letter-spacing:1.2px}
@media(max-width:680px){body{padding:8px}.panel{border-radius:21px}.home{right:12px;top:12px;padding:8px 11px;font-size:9px}.header{padding:72px 18px 21px}h1{font-size:clamp(34px,12vw,48px)}.sub{font-size:11px;line-height:1.4}.content{padding:20px 14px}.timer{grid-template-columns:repeat(2,1fr);gap:10px;margin:22px auto}.box{padding:18px 8px}.num{font-size:40px}.date{font-size:13px}}
</style>
</head>
<body>
<main class="wrap"><section class="panel">
<a class="home" href="./">⌂ HOME</a>
<header class="header"><div class="eyebrow">RECRON INTERPLANT</div><h1 id="title">BOWLING TOURNAMENT 2026</h1><div id="subtitle" class="sub">COUNTDOWN TO TOURNAMENT DAY</div></header>
<section class="content">
<div id="status" class="status">Loading event date...</div><div id="date" class="date"></div><div id="venue" class="venue"></div>
<div id="timer" class="timer">
<div class="box"><div id="d" class="num">00</div><div class="label">DAYS</div></div>
<div class="box"><div id="h" class="num">00</div><div class="label">HOURS</div></div>
<div class="box"><div id="m" class="num">00</div><div class="label">MINUTES</div></div>
<div class="box"><div id="s" class="num">00</div><div class="label">SECONDS</div></div></div>
<div id="done" class="done" style="display:none">🎳 TOURNAMENT DAY</div>
<div class="actions"><a class="btn primary" href="liveindividual.html">🎳 LIVE INDIVIDUAL</a><a class="btn secondary" href="teamgroup.html">🏆 LIVE TEAM</a></div>
</section><footer id="footer">RECRON BOWLING TOURNAMENT 2026</footer>
</section></main>
<script>
const API="https://script.google.com/macros/s/AKfycbwW8_FQ12mi6iQqfZaXbZ7C0qDm5_hR--lSDwYzWGixBu-APdxAxgImby7ZeVkwbRVO/exec";
let target=0,timer=null;
function parseDate(v){
  if(v===null || v===undefined) return null;

  const s=String(v).trim();
  if(!s) return null;

  // GOOGLE SHEET FORMAT: DD/MM/YYYY
  // IMPORTANT: never let the browser interpret 12/10/2026 itself.
  const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);

  if(m){
    const day=Number(m[1]);
    const month=Number(m[2]);
    const year=Number(m[3]);
    const hour=Number(m[4]||9);
    const minute=Number(m[5]||0);
    const second=Number(m[6]||0);

    // Construct locally as YEAR, MONTH-1, DAY.
    const d=new Date(year,month-1,day,hour,minute,second);

    // Reject impossible dates.
    if(
      d.getFullYear()!==year ||
      d.getMonth()!==month-1 ||
      d.getDate()!==day
    ) return null;

    return d;
  }

  // Only use Date parsing for non-DD/MM/YYYY values.
  if(typeof v==="number"){
    const n=new Date(v);
    return isNaN(n.getTime())?null:n;
  }

  const d=new Date(s);
  return isNaN(d.getTime())?null:d;
}

function formatEventDate(d){
  const months=[
    "Januari","Februari","Mac","April","Mei","Jun",
    "Julai","Ogos","September","Oktober","November","Disember"
  ];

  const day=String(d.getDate()).padStart(2,"0");
  const month=months[d.getMonth()];
  const year=d.getFullYear();
  const hour=d.getHours();
  const minute=String(d.getMinutes()).padStart(2,"0");
  const suffix=hour>=12 ? "PG" : "PG";
  const h12=hour%12 || 12;

  return day+" "+month+" "+year+" pada "+String(h12).padStart(2,"0")+":"+minute+" "+suffix;
}
function countdownCallback(x){
  x=x||{};
  document.getElementById("title").textContent=x.Title||"RECRON BOWLING TOURNAMENT 2026";
  document.getElementById("subtitle").textContent=x.Subtitle||"COUNTDOWN TO TOURNAMENT DAY";
  document.getElementById("venue").textContent=x.Venue||"";
  document.getElementById("footer").textContent=x.Footer||"RECRON BOWLING TOURNAMENT 2026";
  let rawDate = "";

Object.keys(x).forEach(function(key){
  const cleanKey = String(key)
    .replace(/\s+/g,"")
    .toLowerCase();

  if(cleanKey === "eventdate"){
    rawDate = x[key];
  }
});

if(!rawDate){
  rawDate = x.EventDate || x["Event Date"] || x.eventDate || x.date || x.DATE || "";
}

console.log("COUNTDOWN DATA:", x);
console.log("COUNTDOWN DATE KEY:", rawDate);

}

let d = null;
const parts = String(rawDate).trim().split("/");

if(parts.length === 3){
  const day = Number(parts[0]);
  const month = Number(parts[1]);
  const year = Number(parts[2]);

  d = new Date(year, month - 1, day, 9, 0, 0);

  if(
    d.getFullYear() !== year ||
    d.getMonth() !== month - 1 ||
    d.getDate() !== day
  ){
    d = null;
  }
}else{
  d = parseDate(rawDate);
}

if(!d){
  document.getElementById("status").textContent="Tarikh acara belum ditetapkan.";
  return;
}

target = d.getTime();
document.getElementById("status").textContent="EVENT DATE";
document.getElementById("date").textContent=formatEventDate(d);
  clearInterval(timer);tick();timer=setInterval(tick,1000);
}
function tick(){
  if(!target)return; let z=target-Date.now();
  if(z<=0){document.getElementById("timer").style.display="none";document.getElementById("done").style.display="block";clearInterval(timer);return}
  const d=Math.floor(z/86400000);z%=86400000;const h=Math.floor(z/3600000);z%=3600000;const m=Math.floor(z/60000);const s=Math.floor((z%60000)/1000);
  document.getElementById("d").textContent=String(d).padStart(2,"0");document.getElementById("h").textContent=String(h).padStart(2,"0");document.getElementById("m").textContent=String(m).padStart(2,"0");document.getElementById("s").textContent=String(s).padStart(2,"0");
}
function load(){
  const old=document.getElementById("countdownApi");if(old)old.remove();
  const s=document.createElement("script");s.id="countdownApi";s.src=API+"?page=api_countdown&callback=countdownCallback&t="+Date.now();
  s.onerror=()=>document.getElementById("status").textContent="Data Countdown belum dapat disambungkan.";
  document.body.appendChild(s);
}
load();
</script>
</body></html>
