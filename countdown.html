<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RECRON • Countdown</title><style>
:root{--bg:#080b12;--panel:#111722;--gold:#f6c744;--gold2:#ffdf72;--text:#f5f7fb;--muted:#9aa5b5;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 50% -10%,rgba(246,199,68,.13),transparent 34%),linear-gradient(180deg,#0b0f17,#070a10);color:var(--text)}
body{padding:10px 8px 28px}.wrap{width:min(1040px,100%);margin:auto}.panel{position:relative;overflow:hidden;border:1px solid rgba(246,199,68,.42);border-radius:24px;background:linear-gradient(135deg,rgba(255,255,255,.035),transparent 45%),linear-gradient(180deg,#131a26,#0d131d);box-shadow:0 24px 70px rgba(0,0,0,.45)}
.home{position:absolute;right:18px;top:16px;z-index:3;padding:9px 14px;border:1px solid rgba(246,199,68,.45);border-radius:999px;background:rgba(246,199,68,.07);color:var(--gold2);text-decoration:none;font-size:11px;font-weight:900;letter-spacing:1px}.header{padding:34px 24px 22px;border-bottom:1px solid var(--line)}.eyebrow{color:var(--gold);font-size:11px;font-weight:900;letter-spacing:2.5px;text-transform:uppercase}h1{margin:8px 0 0;font-size:clamp(32px,6vw,56px);line-height:1}.sub{margin:11px 0 0;color:#c0c8d4;font-size:13px;letter-spacing:.6px}.status{margin-top:10px;color:var(--muted);font-size:10px}.card{border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.015))}footer{padding:18px 24px;border-top:1px solid var(--line);color:#758093;font-size:9px;letter-spacing:1.2px;text-transform:uppercase}
@media(max-width:680px){.header{padding:30px 18px 20px}.home{right:13px;top:13px}.sub{font-size:11px}}

.countwrap{padding:22px 20px 28px;text-align:center}.date{margin:8px 0;color:#c5cdd8;font-size:12px}.venue{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:1px}.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px auto;max-width:760px}.box{padding:20px 10px}.num{font-size:42px;font-weight:900;color:var(--gold)}.label{margin-top:7px;color:#aab4c2;font-size:9px;letter-spacing:1.5px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{padding:12px 18px;border-radius:999px;text-decoration:none;font-size:11px;font-weight:900;letter-spacing:.8px;border:1px solid rgba(246,199,68,.4)}.primary{background:var(--gold);color:#111}.secondary{background:rgba(255,255,255,.04);color:#fff}.done{font-size:24px;color:var(--gold);font-weight:900;margin:25px}@media(max-width:680px){.timer{grid-template-columns:repeat(2,1fr);gap:9px}.box{padding:16px 8px}.num{font-size:34px}}
</style></head><body><main class="wrap"><section class="panel"><a class="home" href="./">⌂ HOME</a><header class="header"><div class="eyebrow">RECRON INTERPLANT</div><h1 id="title">BOWLING TOURNAMENT 2026</h1><div id="subtitle" class="sub">COUNTDOWN TO TOURNAMENT DAY</div></header><section class="countwrap"><div id="date" class="date">Loading event date...</div><div id="venue" class="venue">—</div><div id="timer" class="timer"><div class="card box"><div id="d" class="num">00</div><div class="label">DAYS</div></div><div class="card box"><div id="h" class="num">00</div><div class="label">HOURS</div></div><div class="card box"><div id="m" class="num">00</div><div class="label">MINUTES</div></div><div class="card box"><div id="s" class="num">00</div><div class="label">SECONDS</div></div></div><div id="done" class="done" style="display:none">🎳 TOURNAMENT DAY</div><div class="actions"><a class="btn primary" href="liveindividual.html">🎳 LIVE INDIVIDUAL</a><a class="btn secondary" href="teamgroup.html">🏆 LIVE TEAM</a></div></section><footer>RECRON BOWLING TOURNAMENT 2026</footer></section></main><script>
const API="https://script.google.com/macros/s/AKfycbwW8_FQ12mi6iQqfZaXbZ7C0qDm5_hR--lSDwYzWGixBu-APdxAxgImby7ZeVkwbRVO/exec?page=api_countdown&callback=countdownCallback";let target=0,iv=null;
function countdownCallback(x){x=x||{};document.getElementById("title").textContent=x.Title||"RECRON BOWLING TOURNAMENT 2026";document.getElementById("subtitle").textContent=x.Subtitle||"COUNTDOWN TO TOURNAMENT DAY";document.getElementById("venue").textContent=x.Venue||"—";let raw=x.EventDate||"",dt=new Date(raw);document.getElementById("date").textContent=isNaN(dt)?"":dt.toLocaleString("en-MY",{day:"2-digit",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"});target=dt.getTime();if(iv)clearInterval(iv);tick();iv=setInterval(tick,1000)}
function tick(){if(!target||isNaN(target))return;let z=Math.max(0,target-Date.now());if(z<=0){document.getElementById("timer").style.display="none";document.getElementById("done").style.display="block";clearInterval(iv);return}let d=Math.floor(z/86400000);z%=86400000;let h=Math.floor(z/3600000);z%=3600000;let m=Math.floor(z/60000);let s=Math.floor((z%60000)/1000);document.getElementById("d").textContent=String(d).padStart(2,"0");document.getElementById("h").textContent=String(h).padStart(2,"0");document.getElementById("m").textContent=String(m).padStart(2,"0");document.getElementById("s").textContent=String(s).padStart(2,"0")}
function load(){const s=document.createElement("script");s.src=API;s.onerror=()=>document.getElementById("date").textContent="Unable to load countdown";document.body.appendChild(s)}load();
</script></body></html>
