<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RECRON • Countdown</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #080d14;
      color: #f5f7fb;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 28px 16px;
    }

    .container {
      width: min(900px, 100%);
    }

    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 193, 7, 0.45);
      border-radius: 28px;
      background:
        radial-gradient(
          circle at top right,
          rgba(255, 193, 7, 0.08),
          transparent 35%
        ),
        linear-gradient(
          180deg,
          #151c26 0%,
          #0d141e 100%
        );

      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.45);
    }

    .home {
      position: absolute;
      top: 16px;
      right: 18px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 72px;
      height: 34px;
      padding: 0 14px;

      border: 1px solid rgba(255, 193, 7, 0.55);
      border-radius: 999px;

      color: #ffd54f;
      background: rgba(255, 193, 7, 0.04);

      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-decoration: none;
    }

    .home:hover {
      background: rgba(255, 193, 7, 0.12);
    }

    .header {
      padding: 38px 26px 22px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .eyebrow {
      margin-bottom: 8px;

      color: #ffc107;

      font-size: 12px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .title {
      margin: 0;
      max-width: 780px;

      color: #f7f8fb;

      font-size: clamp(38px, 7vw, 58px);
      line-height: 0.96;
      font-weight: 900;
      letter-spacing: -2px;
      text-transform: uppercase;
    }

    .venue {
      margin-top: 14px;

      color: #d9e3f1;

      font-size: 13px;
      font-weight: 600;
    }

    .content {
      padding: 24px 26px 26px;
      text-align: center;
    }

    .label {
      margin-bottom: 8px;

      color: #aeb8c7;

      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .event-date {
      min-height: 26px;

      color: #e9eef7;

      font-size: 13px;
      font-weight: 600;
    }

    .subtitle {
      margin-top: 8px;

      color: #ffc107;

      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.8px;
    }

    .status {
      margin-top: 14px;

      color: #ffc107;

      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;

      margin-top: 22px;
    }

    .time-box {
      min-height: 110px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;

      background: rgba(255, 255, 255, 0.035);
    }

    .number {
      color: #ffc52b;

      font-size: clamp(38px, 6vw, 54px);
      line-height: 1;
      font-weight: 900;
    }

    .unit {
      margin-top: 10px;

      color: #aeb8c7;

      font-size: 9px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;

      margin-top: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 145px;
      height: 38px;
      padding: 0 18px;

      border: 1px solid rgba(255, 193, 7, 0.55);
      border-radius: 999px;

      color: #ffd54f;
      background: transparent;

      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-decoration: none;
      text-transform: uppercase;
    }

    .btn.primary {
      color: #111820;
      background: #ffc52b;
      border-color: #ffc52b;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .footer {
      padding: 16px 20px;

      border-top: 1px solid rgba(255, 255, 255, 0.07);

      color: #718096;

      font-size: 9px;
      letter-spacing: 0.6px;
    }

    .error {
      color: #ff8a80;
    }

    @media (max-width: 700px) {
      body {
        padding: 12px;
      }

      .card {
        border-radius: 20px;
      }

      .header {
        padding: 30px 20px 20px;
      }

      .content {
        padding: 22px 16px;
      }

      .title {
        font-size: clamp(34px, 11vw, 48px);
      }

      .countdown {
        gap: 7px;
      }

      .time-box {
        min-height: 90px;
        border-radius: 12px;
      }

      .number {
        font-size: 34px;
      }

      .unit {
        font-size: 8px;
        letter-spacing: 1px;
      }

      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

      .home {
        top: 12px;
        right: 12px;
      }
    }

    @media (max-width: 430px) {
      .countdown {
        grid-template-columns: repeat(2, 1fr);
      }

      .event-date {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <a class="home" href="./">⌂ HOME</a>

      <div class="header">

        <div class="eyebrow">
          RECRON
        </div>

        <h1 class="title" id="title">
          RECRON BOWLING TOURNAMENT 2026
        </h1>

        <div class="venue" id="venue">
          Melaka International Bowling Center (MIBC)
        </div>

      </div>

      <div class="content">

        <div class="label">
          EVENT DATE
        </div>

        <div class="event-date" id="date">
          Loading...
        </div>

        <div class="subtitle" id="subtitle">
          Countdown To Tournament Day
        </div>

        <div class="status" id="status">
          COUNTDOWN ACTIVE
        </div>

        <div class="countdown">

          <div class="time-box">
            <div class="number" id="days">--</div>
            <div class="unit">Days</div>
          </div>

          <div class="time-box">
            <div class="number" id="hours">--</div>
            <div class="unit">Hours</div>
          </div>

          <div class="time-box">
            <div class="number" id="minutes">--</div>
            <div class="unit">Minutes</div>
          </div>

          <div class="time-box">
            <div class="number" id="seconds">--</div>
            <div class="unit">Seconds</div>
          </div>

        </div>

        <div class="actions">

          <a
            class="btn primary"
            href="./liveindividual.html"
          >
            🎳 LIVE INDIVIDUAL
          </a>

          <a
            class="btn"
            href="./teamgroup.html"
          >
            🏆 LIVE TEAM
          </a>

        </div>

      </div>

      <div class="footer" id="footer">
        Powered by Recron Bowling Tournament System 2026 | Work Social Committee
      </div>

    </div>

  </div>


  <script>

    /*
     * ============================================================
     * RECRON BOWLING TOURNAMENT 2026
     * COUNTDOWN
     * ============================================================
     */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbwW8_FQ12mi6iQqfZaXbZ7C0qDm5_hR--lSDwYzWGixBu-APdxAxgImby7ZeVkwbRVO/exec";

    let targetTime = null;
    let timer = null;


    /*
     * ------------------------------------------------------------
     * FORMAT EVENT DATE
     * ------------------------------------------------------------
     */

    function formatEventDate(date) {

      const months = [
        "Januari",
        "Februari",
        "Mac",
        "April",
        "Mei",
        "Jun",
        "Julai",
        "Ogos",
        "September",
        "Oktober",
        "November",
        "Disember"
      ];

      const days = [
        "Ahad",
        "Isnin",
        "Selasa",
        "Rabu",
        "Khamis",
        "Jumaat",
        "Sabtu"
      ];

      const dayName = days[date.getDay()];
      const day = String(date.getDate()).padStart(2, "0");
      const month = months[date.getMonth()];
      const year = date.getFullYear();

      let hour = date.getHours();
      const minute = String(date.getMinutes()).padStart(2, "0");

      const suffix = hour >= 12 ? "PTG" : "PG";

      hour = hour % 12 || 12;

      return (
        dayName +
        ", " +
        day +
        " " +
        month +
        " " +
        year +
        " pada " +
        String(hour).padStart(2, "0") +
        ":" +
        minute +
        " " +
        suffix
      );
    }


    /*
     * ------------------------------------------------------------
     * PARSE API DATE
     *
     * CURRENT APPS SCRIPT API RETURNS:
     *
     * 10/12/2026 9:00:00
     *
     * The actual Google Sheet Date object is:
     *
     * 12 October 2026 09:00
     *
     * Therefore this parser treats slash dates from the API
     * as M/D/YYYY.
     * ------------------------------------------------------------
     */

    function parseDate(value) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return null;
      }

      if (value instanceof Date) {

        return isNaN(value.getTime())
          ? null
          : value;

      }


      /*
       * If Google sends a numeric timestamp
       */

      if (typeof value === "number") {

        const d = new Date(value);

        return isNaN(d.getTime())
          ? null
          : d;
      }


      const s = String(value).trim();


      /*
       * API FORMAT:
       *
       * M/D/YYYY
       * M/D/YYYY H:mm
       * M/D/YYYY H:mm:ss
       *
       * Example:
       *
       * 10/12/2026 9:00:00
       *
       * = October 12, 2026
       */

      const usMatch = s.match(
        /^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/
      );


      if (usMatch) {

        const month = Number(usMatch[1]);
        const day = Number(usMatch[2]);
        const year = Number(usMatch[3]);

        const hour = Number(usMatch[4] || 0);
        const minute = Number(usMatch[5] || 0);
        const second = Number(usMatch[6] || 0);

        const d = new Date(
          year,
          month - 1,
          day,
          hour,
          minute,
          second
        );


        if (
          d.getFullYear() !== year ||
          d.getMonth() !== month - 1 ||
          d.getDate() !== day
        ) {
          return null;
        }

        return d;
      }


      /*
       * ISO / browser-compatible fallback
       */

      const fallback = new Date(s);

      return isNaN(fallback.getTime())
        ? null
        : fallback;
    }


    /*
     * ------------------------------------------------------------
     * COUNTDOWN TIMER
     * ------------------------------------------------------------
     */

    function tick() {

      if (!targetTime) {
        return;
      }

      const now = Date.now();

      let difference = targetTime - now;


      if (difference <= 0) {

        difference = 0;

        document.getElementById("status").textContent =
          "TOURNAMENT DAY";

      }


      const totalSeconds =
        Math.floor(difference / 1000);

      const days =
        Math.floor(totalSeconds / 86400);

      const hours =
        Math.floor((totalSeconds % 86400) / 3600);

      const minutes =
        Math.floor((totalSeconds % 3600) / 60);

      const seconds =
        totalSeconds % 60;


      document.getElementById("days").textContent =
        String(days);

      document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");

      document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");

      document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");
    }


    /*
     * ------------------------------------------------------------
     * API CALLBACK
     * ------------------------------------------------------------
     */

    function countdownCallback(data) {

      data = data || {};


      document.getElementById("title").textContent =
        data.Title ||
        "RECRON BOWLING TOURNAMENT 2026";


      document.getElementById("subtitle").textContent =
        data.Subtitle ||
        "Countdown To Tournament Day";


      document.getElementById("venue").textContent =
        data.Venue ||
        "Melaka International Bowling Center (MIBC)";


      document.getElementById("footer").textContent =
        data.Footer ||
        "Powered by Recron Bowling Tournament System 2026 | Work Social Committee";


      /*
       * Apps Script can return either:
       *
       * EventDate
       *
       * or:
       *
       * Event Date
       */

      const rawDate =
        data.EventDate ||
        data["Event Date"] ||
        data.eventDate ||
        data.date ||
        data.DATE ||
        "";


      const date = parseDate(rawDate);


      if (!date) {

        document.getElementById("status").textContent =
          "TARIKH ACARA BELUM DITETAPKAN";

        document.getElementById("date").textContent =
          "Tarikh tidak tersedia";

        return;
      }


      targetTime = date.getTime();


      document.getElementById("date").textContent =
        formatEventDate(date);


      document.getElementById("status").textContent =
        "COUNTDOWN ACTIVE";


      if (timer) {
        clearInterval(timer);
      }


      tick();

      timer = setInterval(
        tick,
        1000
      );
    }


    /*
     * ------------------------------------------------------------
     * LOAD GOOGLE APPS SCRIPT API
     * ------------------------------------------------------------
     */

    function loadCountdown() {

      const callbackName =
        "countdownCallback";


      const oldScript =
        document.getElementById("countdown-api");


      if (oldScript) {
        oldScript.remove();
      }


      const script =
        document.createElement("script");


      script.id =
        "countdown-api";


      script.src =
        API_URL +
        "?page=api_countdown" +
        "&callback=" +
        callbackName +
        "&t=" +
        Date.now();


      script.onerror = function() {

        document.getElementById("status").textContent =
          "API CONNECTION ERROR";

      };


      document.body.appendChild(script);
    }


    /*
     * ------------------------------------------------------------
     * START
     * ------------------------------------------------------------
     */

    loadCountdown();

  </script>

</body>
</html>
