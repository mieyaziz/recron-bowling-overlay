<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Score Entry • Recron Bowling Tournament 2026</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#f4f8f5}
body{padding:10px}
.top{max-width:1200px;margin:0 auto 10px;display:flex;gap:8px;justify-content:flex-end}
.top button{border:1px solid #dfe7e2;background:#fff;color:#17231c;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}
.frame-wrap{max-width:1200px;margin:auto;background:#fff;border:1px solid #dfe7e2;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.08)}
iframe{display:block;width:100%;height:calc(100vh - 30px);min-height:850px;border:0;background:#fff}
@media(max-width:600px){body{padding:6px}.top button{flex:1}iframe{height:calc(100vh - 18px);min-height:900px}}
</style>
</head>
<body>
<div class="top">
  <button onclick="location.href='./'">⌂ HOME</button>
  <button onclick="history.back()">← BACK</button>
</div>

<div class="frame-wrap">
  <iframe
    src="https://script.google.com/macros/s/AKfycbwW8_FQ12mi6iQqfZaXbZ7C0qDm5_hR--lSDwYzWGixBu-APdxAxgImby7ZeVkwbRVO/exec?page=scoreentry"
    title="Recron Bowling Tournament 2026 - Score Entry"
    allow="fullscreen">
  </iframe>
</div>
</body>
</html>
