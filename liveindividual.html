<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RECRON • Live Individual</title>
<style>
:root{--bg:#070a10;--panel:#111722;--gold:#f6c744;--text:#f5f7fb;--muted:#9aa5b5;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#0b0f17,#05070b);color:var(--text)}
body{padding:12px}.wrap{width:min(1100px,100%);margin:auto}.panel{border:1px solid rgba(246,199,68,.45);border-radius:24px;overflow:hidden;background:linear-gradient(145deg,#151c28,#0c121b);box-shadow:0 25px 70px rgba(0,0,0,.45)}
.header{position:relative;padding:32px 25px 22px;border-bottom:1px solid var(--line)}.home{position:absolute;right:18px;top:17px;padding:9px 14px;border:1px solid rgba(246,199,68,.5);border-radius:999px;background:rgba(246,199,68,.07);color:#ffdf72;text-decoration:none;font-size:10px;font-weight:900;letter-spacing:1px}.eyebrow{color:var(--gold);font-size:10px;font-weight:900;letter-spacing:2.5px}.header h1{margin:7px 0 0;font-size:clamp(30px,5vw,48px);line-height:1}.sub{margin-top:8px;color:var(--muted);font-size:11px;letter-spacing:1px}.updated{position:absolute;right:25px;bottom:23px;color:#7f899a;font-size:9px}
.controls{display:flex;gap:8px;padding:16px 20px;border-bottom:1px solid var(--line)}.tab{flex:1;padding:11px 10px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(255,255,255,.04);color:#fff;font-weight:900;font-size:10px}.tab.active{background:var(--gold);color:#111;border-color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 20px}.stat{padding:12px;text-align:center;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.025)}.stat b{display:block;font-size:20px;color:var(--gold)}.stat span{font-size:8px;color:var(--muted);letter-spacing:1px}
.list{padding:0 20px 20px}.row{display:grid;grid-template-columns:48px minmax(0,1fr) 90px;gap:12px;align-items:center;padding:13px 14px;margin:7px 0;border:1px solid rgba(255,255,255,.06);border-radius:14px;background:rgba(255,255,255,.035)}.row.top1{background:linear-gradient(90deg,rgba(246,199,68,.15),rgba(255,255,255,.025))}.row.top2{background:linear-gradient(90deg,rgba(210,210,210,.09),rgba(255,255,255,.025))}.row.top3{background:linear-gradient(90deg,rgba(180,120,50,.09),rgba(255,255,255,.025))}.rank{text-align:center;font-size:19px;font-weight:950}.name{font-size:14px;font-weight:900;overflow-wrap:anywhere}.team{margin-top:3px;color:#7e899b;font-size:9px;letter-spacing:.4px}.score{text-align:right;font-size:20px;font-weight:950;color:var(--gold)}.empty{text-align:center;padding:50px 15px;color:var(--muted)}
footer{padding:16px 20px;border-top:1px solid var(--line);font-size:9px;color:#748093;letter-spacing:1px}
@media(max-width:600px){body{padding:7px}.panel{border-radius:20px}.header{padding:70px 16px 20px}.home{top:11px;right:11px}.updated{position:static;margin-top:8px}.controls{padding:12px 12px}.stats{padding:12px;gap:7px}.list{padding:0 10px 12px}.row{grid-template-columns:34px minmax(0,1fr) 58px;gap:8px;padding:11px 9px}.rank{font-size:16px}.name{font-size:13px}.score{font-size:18px}}
</style>
</head>
<body><main class="wrap"><section class="panel">
<header class="header"><a class="home" href="./">⌂ HOME</a><div class="eyebrow">RECRON BOWLING TOURNAMENT 2026</div><h1>LIVE INDIVIDUAL</h1><div class="sub">LIVE INDIVIDUAL SCOREBOARD • TOP 10</div><div id="updated" class="updated">Updating...</div></header>
<div class="controls"><button class="tab active" data-g="ALL">SEMUA</button><button class="tab" data-g="LELAKI">LELAKI</button><button class="tab" data-g="PEREMPUAN">PEREMPUAN</button></div>
<div class="stats"><div class="stat"><b id="players">0</b><span>PLAYERS</span></div><div class="stat"><b id="games">0</b><span>GAMES SCORED</span></div><div class="stat"><b id="avg">0</b><span>AVERAGE</span></div></div>
<div id="list" class="list"><div class="empty">Loading live scores...</div></div>
<footer>RECRON • LIVE BOWLING 2026</footer>
</section></main>
<script>
const API="https://script.google.com/macros/s/AKfycbwW8_FQ12mi6iQqfZaXbZ7C0qDm5_hR--lSDwYzWGixBu-APdxAxgImby7ZeVkwbRVO/exec";let gender="ALL",last=[];
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{gender=b.dataset.g;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));render()});
function callback(data){if(!data||!data.success)return;last=data.players||[];document.getElementById("updated").textContent="Updated "+(data.updated||new Date().toLocaleTimeString("ms-MY"));render()}
function render(){
  const rows=last.filter(p=>gender==="ALL"||String(p.gender||"").toUpperCase()===gender).sort((a,b)=>Number(b.total||0)-Number(a.total||0));
  document.getElementById("players").textContent=rows.length;
  document.getElementById("games").textContent=rows.filter(p=>Number(p.total||0)>0).length;
  const avg=rows.length?rows.reduce((a,p)=>a+Number(p.total||0),0)/rows.length:0;document.getElementById("avg").textContent=avg.toFixed(0);
  document.getElementById("list").innerHTML=rows.slice(0,20).map((p,i)=>{const r=i+1,m=r===1?"🥇":r===2?"🥈":r===3?"🥉":r;return `<div class="row ${r<=3?"top"+r:""}"><div class="rank">${m}</div><div><div class="name">${esc(p.nama||p.name)}</div><div class="team">${esc(p.team||"-")}</div></div><div class="score">${Number(p.total||0)}</div></div>`}).join("")||'<div class="empty">Belum ada data untuk kategori ini.</div>';
}
function load(){const old=document.getElementById("api");if(old)old.remove();const s=document.createElement("script");s.id="api";s.src=API+"?page=api_liveindividual&callback=callback&t="+Date.now();s.onerror=()=>document.getElementById("list").innerHTML='<div class="empty">Data tidak dapat dimuatkan.</div>';document.body.appendChild(s)}
load();setInterval(load,10000);
</script></body></html>
