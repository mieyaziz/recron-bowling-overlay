<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RECRON • Attendance</title>

  <style>
    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      min-height:100%;
      font-family:Arial,Helvetica,sans-serif;
      background:#080d14;
      color:#f5f7fb;
    }

    body{padding:24px 14px}

    .container{
      width:min(1180px,100%);
      margin:auto;
    }

    .card{
      overflow:hidden;
      border:1px solid rgba(255,193,7,.42);
      border-radius:24px;
      background:
        radial-gradient(circle at top right,rgba(255,193,7,.08),transparent 30%),
        linear-gradient(180deg,#151c26 0%,#0d141e 100%);
      box-shadow:0 25px 80px rgba(0,0,0,.45);
    }

    .header{
      position:relative;
      padding:30px 28px 24px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .home{
      position:absolute;
      top:18px;
      right:20px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      height:34px;
      padding:0 15px;
      border:1px solid rgba(255,193,7,.55);
      border-radius:999px;
      color:#ffd54f;
      background:rgba(255,193,7,.04);
      font-size:10px;
      font-weight:900;
      letter-spacing:1px;
      text-decoration:none;
    }

    .home:hover{background:rgba(255,193,7,.12)}

    .eyebrow{
      margin-bottom:8px;
      color:#ffc107;
      font-size:11px;
      font-weight:900;
      letter-spacing:3px;
      text-transform:uppercase;
    }

    .title{
      margin:0;
      color:#f7f8fb;
      font-size:clamp(32px,6vw,52px);
      line-height:1;
      font-weight:900;
      letter-spacing:-1.5px;
    }

    .subtitle{
      margin-top:12px;
      color:#9faabd;
      font-size:12px;
      font-weight:600;
    }

    .summary{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
      padding:20px 28px 0;
    }

    .summary-box{
      min-height:100px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      padding:18px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:16px;
      background:rgba(255,255,255,.035);
    }

    .summary-label{
      color:#8e9aab;
      font-size:9px;
      font-weight:900;
      letter-spacing:1.5px;
      text-transform:uppercase;
    }

    .summary-number{
      margin-top:7px;
      color:#ffc52b;
      font-size:34px;
      line-height:1;
      font-weight:900;
    }

    .present .summary-number{color:#66e3a4}
    .absent .summary-number{color:#ff9d9d}

    .controls{
      display:flex;
      align-items:center;
      gap:10px;
      padding:22px 28px 18px;
    }

    .search{
      width:100%;
      height:44px;
      padding:0 16px;
      outline:none;
      border:1px solid rgba(255,255,255,.1);
      border-radius:12px;
      color:#f5f7fb;
      background:rgba(255,255,255,.045);
      font-size:13px;
    }

    .search::placeholder{color:#6f7b8c}
    .search:focus{border-color:rgba(255,193,7,.5)}

    .refresh{
      flex:0 0 auto;
      height:44px;
      padding:0 18px;
      border:1px solid rgba(255,193,7,.5);
      border-radius:12px;
      color:#ffd54f;
      background:rgba(255,193,7,.04);
      font-size:10px;
      font-weight:900;
      cursor:pointer;
    }

    .refresh:hover{background:rgba(255,193,7,.1)}

    .table-wrap{
      padding:0 28px 26px;
      overflow-x:auto;
    }

    table{
      width:100%;
      min-width:720px;
      border-collapse:separate;
      border-spacing:0;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.07);
      border-radius:14px;
    }

    th{
      padding:13px 14px;
      color:#8995a7;
      background:rgba(255,255,255,.035);
      font-size:9px;
      font-weight:900;
      letter-spacing:1px;
      text-align:left;
      text-transform:uppercase;
      border-bottom:1px solid rgba(255,255,255,.07);
    }

    td{
      padding:13px 14px;
      color:#dce3ed;
      font-size:12px;
      border-bottom:1px solid rgba(255,255,255,.055);
    }

    tr:last-child td{border-bottom:none}
    tbody tr:hover{background:rgba(255,255,255,.025)}

    .id{
      color:#9da9ba;
      font-family:Consolas,monospace;
      font-size:11px;
    }

    .name{color:#fff;font-weight:800}
    .section{color:#aeb9c9}
    .team{color:#d5ddea;font-weight:700}

    .status{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:92px;
      padding:6px 10px;
      border-radius:999px;
      font-size:9px;
      font-weight:900;
      letter-spacing:.5px;
    }

    .status.present{
      color:#72efae;
      background:rgba(50,205,130,.1);
      border:1px solid rgba(50,205,130,.2);
    }

    .status.absent{
      color:#ff9d9d;
      background:rgba(255,90,90,.08);
      border:1px solid rgba(255,90,90,.16);
    }

    .status.other{
      color:#ffd76a;
      background:rgba(255,193,7,.08);
      border:1px solid rgba(255,193,7,.16);
    }

    .message{
      padding:40px 20px!important;
      color:#7f8b9d;
      text-align:center;
    }

    .error{color:#ff9d9d!important}

    .footer{
      padding:16px 28px;
      border-top:1px solid rgba(255,255,255,.07);
      color:#697587;
      font-size:9px;
      letter-spacing:.5px;
    }

    @media(max-width:700px){
      body{padding:10px}
      .card{border-radius:18px}
      .header{padding:26px 18px 20px}
      .home{top:13px;right:13px}
      .summary{
        grid-template-columns:repeat(3,1fr);
        gap:7px;
        padding:15px 14px 0;
      }
      .summary-box{min-height:78px;padding:12px}
      .summary-number{font-size:25px}
      .summary-label{font-size:7px;letter-spacing:.8px}
      .controls{padding:16px 14px 14px}
      .refresh{padding:0 12px}
      .table-wrap{padding:0 14px 20px}
      .footer{padding:14px}
    }

    @media(max-width:430px){
      .title{font-size:34px}
      .controls{flex-direction:column;align-items:stretch}
      .refresh{width:100%}
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">

      <div class="header">
        <a class="home" href="./">⌂ HOME</a>

        <div class="eyebrow">RECRON BOWLING TOURNAMENT 2026</div>

        <h1 class="title">ATTENDANCE</h1>

        <div class="subtitle">
          Participant Attendance Status
        </div>
      </div>

      <div class="summary">
        <div class="summary-box">
          <div class="summary-label">Jumlah Peserta</div>
          <div class="summary-number" id="totalCount">0</div>
        </div>

        <div class="summary-box present">
          <div class="summary-label">Sudah Hadir</div>
          <div class="summary-number" id="presentCount">0</div>
        </div>

        <div class="summary-box absent">
          <div class="summary-label">Belum Hadir</div>
          <div class="summary-number" id="absentCount">0</div>
        </div>
      </div>

      <div class="controls">
        <input
          id="search"
          class="search"
          type="search"
          placeholder="Cari nama, No ID, section atau team..."
          autocomplete="off"
        >

        <button
          id="refreshBtn"
          class="refresh"
          type="button"
        >
          ↻ REFRESH
        </button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>No ID</th>
              <th>Nama Penuh</th>
              <th>Section</th>
              <th>Team</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody id="attendanceBody">
            <tr>
              <td colspan="5" class="message">
                Memuatkan attendance...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="footer">
        Recron Bowling Tournament 2026 | Attendance System
      </div>

    </div>
  </div>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbwW8_FQ12mi6iQqfZaXbZ7C0qDm5_hR--lSDwYzWGixBu-APdxAxgImby7ZeVkwbRVO/exec";

    let attendanceData = [];

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
    }

    function getStatusClass(status) {
      const s = String(status || "")
        .trim()
        .toUpperCase();

      if (s === "HADIR") return "present";

      if (
        s === "BELUM HADIR" ||
        s === "TIDAK HADIR"
      ) {
        return "absent";
      }

      return "other";
    }

    function updateSummary() {
      const total = attendanceData.length;

      const present = attendanceData.filter(item =>
        String(item.status || "")
          .trim()
          .toUpperCase() === "HADIR"
      ).length;

      const absent = attendanceData.filter(item =>
        String(item.status || "")
          .trim()
          .toUpperCase() === "BELUM HADIR"
      ).length;

      document.getElementById("totalCount").textContent = total;
      document.getElementById("presentCount").textContent = present;
      document.getElementById("absentCount").textContent = absent;
    }

    function renderAttendance() {
      const body = document.getElementById("attendanceBody");

      const search = String(
        document.getElementById("search").value || ""
      )
        .trim()
        .toLowerCase();

      const filtered = attendanceData.filter(item => {
        const text = [
          item.id,
          item.nama,
          item.section,
          item.team,
          item.status
        ]
          .join(" ")
          .toLowerCase();

        return text.includes(search);
      });

      if (!filtered.length) {
        body.innerHTML = `
          <tr>
            <td colspan="5" class="message">
              Tiada rekod dijumpai.
            </td>
          </tr>
        `;
        return;
      }

      body.innerHTML = filtered.map(item => {
        const status = String(
          item.status || "BELUM HADIR"
        ).trim().toUpperCase();

        return `
          <tr>
            <td class="id">${escapeHtml(item.id)}</td>
            <td class="name">${escapeHtml(item.nama)}</td>
            <td class="section">${escapeHtml(item.section)}</td>
            <td class="team">${escapeHtml(item.team)}</td>
            <td>
              <span class="status ${getStatusClass(status)}">
                ${escapeHtml(status)}
              </span>
            </td>
          </tr>
        `;
      }).join("");
    }

    function attendanceCallback(data) {
      attendanceData = Array.isArray(data) ? data : [];
      updateSummary();
      renderAttendance();
    }

    function loadAttendance() {
      const body = document.getElementById("attendanceBody");

      body.innerHTML = `
        <tr>
          <td colspan="5" class="message">
            Memuatkan attendance...
          </td>
        </tr>
      `;

      const oldScript =
        document.getElementById("attendance-api");

      if (oldScript) oldScript.remove();

      const script = document.createElement("script");

      script.id = "attendance-api";

      script.src =
        API_URL +
        "?page=api_attendance" +
        "&callback=attendanceCallback" +
        "&t=" +
        Date.now();

      script.onerror = function() {
        body.innerHTML = `
          <tr>
            <td colspan="5" class="message error">
              Gagal mendapatkan data attendance.
            </td>
          </tr>
        `;
      };

      document.body.appendChild(script);
    }

    document
      .getElementById("search")
      .addEventListener("input", renderAttendance);

    document
      .getElementById("refreshBtn")
      .addEventListener("click", loadAttendance);

    setInterval(loadAttendance, 10000);

    loadAttendance();
  </script>
</body>
</html>
