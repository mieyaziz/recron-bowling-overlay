<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif;color:#fff}
.overlay{position:relative;width:100%;height:100%;background:transparent}
.panel{position:absolute;left:0;right:0;bottom:0;padding:12px 12px 10px;border-radius:16px 16px 0 0;background:rgba(18,18,18,.88);border:1px solid rgba(212,175,55,.8);border-bottom:0;box-shadow:0 -4px 22px rgba(0,0,0,.35)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bar b{font-size:13px;color:#e0b93f;letter-spacing:1px}.updated{font-size:9px;color:#bbb}
.tabs{display:flex;gap:5px;margin-bottom:8px}.tabs button{flex:1;border:1px solid #777;background:rgba(255,255,255,.08);color:#fff;border-radius:13px;padding:6px 2px;font-size:9px;font-weight:bold}.tabs button.active{background:#d4af37;color:#111;border-color:#d4af37}
#ranking{max-height:40vh;overflow:hidden}.row{display:grid;grid-template-columns:30px 1fr 58px;gap:7px;align-items:center;padding:6px 7px;margin:3px 0;border-radius:7px;background:rgba(255,255,255,.11);border-left:3px solid transparent;min-height:34px}.row:nth-child(1){border-left-color:#d4af37}.row:nth-child(2){border-left-color:#c0c0c0}.row:nth-child(3){border-left-color:#a66a35}.rank{text-align:center;font-size:14px;font-weight:900}.name{font-size:11px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.team{font-size:8px;color:#bbb;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{text-align:right;font-size:15px;font-weight:900}.empty{text-align:center;padding:18px;color:#bbb;font-size:11px}
@media(max-width:500px){.panel{padding:9px 8px 8px}.bar b{font-size:11px}.updated{font-size:8px}.tabs{margin-bottom:6px}.tabs button{font-size:8px;padding:5px 1px}.row{grid-template-columns:27px 1fr 48px;padding:5px 6px;margin:2px 0;min-height:29px}.name{font-size:9px}.team{font-size:7px}.score{font-size:12px}.rank{font-size:12px}}
</style>
</head>
<body>
<div class="overlay">
  <div class="panel">
    <div class="bar"><b>LIVE INDIVIDUAL</b><span class="updated" id="updated">Loading...</span></div>
    <div class="tabs"><button id="all" onclick="setGender('ALL')">SEMUA</button><button id="male" onclick="setGender('LELAKI')">LELAKI</button><button id="female" onclick="setGender('PEREMPUAN')">PEREMPUAN</button></div>
    <div id="ranking"><div class="empty">Memuatkan keputusan...</div></div>
  </div>
</div>
<script>
let gender='ALL';let jsonpId=0;
const API_URL='https://script.google.com/macros/s/AKfycbwW8_FQ12mi6iQqfZaXbZ7C0qDm5_hR--lSDwYzWGixBu-APdxAxgImby7ZeVkwbRVO/exec';
document.addEventListener('DOMContentLoaded',()=>{buttons();load();setInterval(load,10000)});
function setGender(g){gender=g;buttons();load()}
function buttons(){['all','male','female'].forEach(id=>document.getElementById(id).classList.remove('active'));document.getElementById({ALL:'all',LELAKI:'male',PEREMPUAN:'female'}[gender]).classList.add('active')}
function norm(g){g=String(g||'').trim().toUpperCase();return ['L','LELAKI','MALE','M'].includes(g)?'LELAKI':['P','PEREMPUAN','FEMALE','F'].includes(g)?'PEREMPUAN':''}
function load(){const cb='recronLiveCallback_'+(++jsonpId);window[cb]=r=>{try{if(!r||!r.success){err('Data tidak berjaya dibaca');return}let p=(r.players||[]).filter(x=>gender==='ALL'||norm(x.gender)===gender).sort((a,b)=>Number(b.total||0)-Number(a.total||0));render(p);document.getElementById('updated').textContent='Update '+new Date().toLocaleTimeString('ms-MY')}finally{delete window[cb];const old=document.getElementById(cb);if(old)old.remove()}};const s=document.createElement('script');s.id=cb;s.src=API_URL+(API_URL.includes('?')?'&':'?')+'page=api_liveindividual&callback='+cb+'&t='+Date.now();s.onerror=()=>{err('Ralat sambungan data');delete window[cb];s.remove()};document.body.appendChild(s)}
function render(p){const el=document.getElementById('ranking');if(!p.length){el.innerHTML='<div class="empty">Tiada data untuk kategori ini.</div>';return}el.innerHTML=p.slice(0,10).map((x,i)=>{const r=i+1;const medal=r===1?'🥇':r===2?'🥈':r===3?'🥉':r;return `<div class="row"><div class="rank">${medal}</div><div><div class="name">${esc(x.name||x.nama||'-')}</div><div class="team">${esc(x.team||x.pasukan||'-')}</div></div><div class="score">${Number(x.total||x.totalScore||0)}</div></div>`}).join('')}
function err(m){document.getElementById('ranking').innerHTML='<div class="empty">'+m+'</div>'}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
</script>
</body>
</html>
