<!DOCTYPE html>
<html><head><base target="_top"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif;color:#fff}.overlay{width:100%;height:100%;position:relative;background:transparent}.top{position:absolute;top:0;left:0;right:0;padding:28px 24px 18px;text-align:center;background:linear-gradient(180deg,rgba(0,0,0,.82),rgba(0,0,0,0));text-shadow:0 2px 5px #000}.logo{font-size:32px;font-weight:900;letter-spacing:5px}.title{font-size:16px;font-weight:bold;color:#d4af37;letter-spacing:1px;margin-top:5px}.live{display:inline-block;margin-top:8px;background:#d60000;border-radius:18px;padding:5px 12px;font-size:11px;font-weight:bold}.panel{position:absolute;left:18px;right:18px;bottom:72px;padding:14px 14px 12px;border-radius:16px;background:rgba(0,0,0,.76);border:1px solid rgba(212,175,55,.75);box-shadow:0 5px 25px rgba(0,0,0,.4)}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.bar b{font-size:14px;color:#d4af37;letter-spacing:1px}.updated{font-size:9px;color:#bbb}.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;border:1px solid #777;background:rgba(255,255,255,.08);color:#fff;border-radius:14px;padding:6px 2px;font-size:10px;font-weight:bold}.tabs button.active{background:#d4af37;color:#111;border-color:#d4af37}.row{display:grid;grid-template-columns:34px 1fr 58px;gap:8px;align-items:center;padding:9px 8px;margin:5px 0;border-radius:8px;background:rgba(255,255,255,.10);border-left:3px solid transparent}.row:nth-child(1){border-left-color:#d4af37}.row:nth-child(2){border-left-color:#c0c0c0}.row:nth-child(3){border-left-color:#a66a35}.rank{text-align:center;font-size:15px;font-weight:900}.name{font-size:12px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.team{font-size:9px;color:#bbb;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{text-align:right;font-size:16px;font-weight:900}.footer{position:absolute;bottom:0;left:0;right:0;padding:13px;text-align:center;background:linear-gradient(0deg,rgba(0,0,0,.9),rgba(0,0,0,0));font-size:10px;letter-spacing:1px;color:#ddd}.empty{text-align:center;padding:25px;color:#bbb;font-size:12px}@media(max-width:500px){.logo{font-size:24px}.title{font-size:12px}.panel{left:10px;right:10px;bottom:58px}.row{padding:7px 6px}}
</style></head><body><div class="overlay"><div class="top"><div class="logo">RECRON</div><div class="title">INTERPLANT BOWLING TOURNAMENT 2026</div><div class="live">● LIVE RESULTS</div></div><div class="panel"><div class="bar"><b>LIVE INDIVIDUAL</b><span class="updated" id="updated">Loading...</span></div><div class="tabs"><button id="all" onclick="setGender('ALL')">SEMUA</button><button id="male" onclick="setGender('LELAKI')">LELAKI</button><button id="female" onclick="setGender('PEREMPUAN')">PEREMPUAN</button></div><div id="ranking"><div class="empty">Memuatkan keputusan...</div></div></div><div class="footer">RECRON • LIVE BOWLING 2026</div></div><script>
let gender='ALL';document.addEventListener('DOMContentLoaded',()=>{buttons();load();setInterval(load,10000)});function setGender(g){gender=g;buttons();load()}function buttons(){['all','male','female'].forEach(id=>document.getElementById(id).classList.remove('active'));document.getElementById({ALL:'all',LELAKI:'male',PEREMPUAN:'female'}[gender]).classList.add('active')}function norm(g){g=String(g||'').trim().toUpperCase();return ['L','LELAKI','MALE','M'].includes(g)?'LELAKI':['P','PEREMPUAN','FEMALE','F'].includes(g)?'PEREMPUAN':''}const API_URL='https://script.google.com/macros/s/AKfycbwW8_FQ12mi6iQqfZaXbZ7C0qDm5_hR--lSDwYzWGixBu-APdxAxgImby7ZeVkwbRVO/exec';
let jsonpId=0;
function load(){
  if(API_URL.includes('PASTE_APPS_SCRIPT')){err('Sila tetapkan URL Apps Script');return}
  const cb='recronLiveCallback_'+(++jsonpId);
  window[cb]=r=>{
    try{if(!r||!r.success){err('Data tidak berjaya dibaca');return}let p=(r.players||[]).filter(x=>gender==='ALL'||norm(x.gender)===gender).sort((a,b)=>Number(b.total||0)-Number(a.total||0));render(p);document.getElementById('updated').textContent='Update '+new Date().toLocaleTimeString('ms-MY')}
    finally{delete window[cb];const s=document.getElementById(cb);if(s)s.remove()}
  };
  const s=document.createElement('script');s.id=cb;s.src=API_URL+(API_URL.includes('?')?'&':'?')+'page=api_liveindividual&callback='+cb+'&t='+Date.now();s.onerror=()=>{err('Ralat sambungan data');delete window[cb];s.remove()};document.body.appendChild(s);
}function render(p){let el=document.getElementById('ranking');if(!p.length){el.innerHTML='<div class="empty">Tiada data untuk kategori ini.</div>';return}el.innerHTML=p.slice(0,10).map((x,i)=>{let r=i+1,m=r===1?'🥇':r===2?'🥈':r===3?'🥉':r;return `<div class="row"><div class="rank">${m}</div><div><div class="name">${esc(x.name||x.nama||'-')}</div><div class="team">${esc(x.team||x.pasukan||'-')}</div></div><div class="score">${Number(x.total||x.totalScore||0)}</div></div>`}).join('')}function err(m){document.getElementById('ranking').innerHTML='<div class="empty">'+m+'</div>'}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
</script></body></html>
